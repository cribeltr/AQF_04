function crearPendienteAuto(mp){
  const yaExiste=state.pendientes.some(p=>p.origenMP===mp.id);
  if(yaExiste) return;
  let tipo, origen="preventiva", tareas=[];
  if(/^C[1-8]$/.test(mp.resultado)){
    tipo="reprogramacion";
    tareas=[ {texto:"generar reporte",hecha:false}, {texto:"imprimir reporte",hecha:false},
             {texto:"firma del supervisor",hecha:false}, {texto:"firma del jefe de equipos",hecha:false} ];
  } else {
    tipo = mp.tipoMantenimiento==="Externo"?"protocolo_externo":"protocolo_interno";
    tareas = tipo==="protocolo_externo"
      ? [ {texto:"solicitar reporte al proveedor",hecha:false}, {texto:"recibir y archivar reporte",hecha:false} ]
      : [ {texto:"completar reporte interno de la MP",hecha:false} ];
  }
  state.pendientes.push({
    id:uid(), creado:todayISO(), origenMP:mp.id, equipoKey:mp.equipoKey, origen, tipo,
    causal:/^C[1-8]$/.test(mp.resultado)?mp.resultado:"", fechaReporte:mp.fecha,
    fechaCompromiso:mp.fecha, prioridad:"Media", situacion:"",
    respEjecutivo:mp.ejecutor||"", respAdministrativo:RESP_ADMIN_DEFAULT, enEsperaDe:"",
    descripcion:`Asociado a MP del ${fmtDate(mp.fecha)}${mp.resultado?` (resultado ${mp.resultado})`:""}.`,
    tareas, seguimiento:[], empresa:mp.empresaExterna||"",
    estado:"Abierto", fechaCompletado:""
  });
  toast("Pendiente automático creado.");
}

function matchEquipo(str){
  if(!str) return null;
  const inv=str.split("·")[0].trim();
  let e=state.equipos.find(x=>x.inventario===inv);
  if(e) return e;
  const up=str.trim().toUpperCase();

/* ---------------------------- Badges helpers ----------------------------- */
function badgeEstado(est){
  const map={ "Operativo":"b-ok","No Operativo":"b-bad","Servicio Técnico":"b-warn","Préstamo":"b-info","No Ubicable":"b-warn","Baja":"b-neutral" };
  return el("span",{class:"badge "+(map[est]||"b-neutral")}, est||"—");
}
function badgeResultado(res){
  if(!res) return el("span",{class:"faint"},"—");
  let cls="b-neutral";
  if(res==="Si"||res==="Si-RA") cls="b-ok";
  else if(/^C[1-8]$/.test(res)) cls="b-warn";
  else if(res==="FS"||res==="No") cls="b-bad";
  else if(res==="NU") cls="b-warn";
  else if(res==="Baja") cls="b-neutral";
  else if(["X","R","RA","PM"].includes(res)) cls="b-info";
  return el("span",{class:"badge "+cls}, res);
}

async function importJSON(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.tipo==="respaldo-gmp2026"){ // formato viejo → usar importador de migración
      return importOldBackupData(data);
    }
    if(data.detalleMP) state.detalleMP=data.detalleMP;
    if(data.pendientes) state.pendientes=data.pendientes;
    if(data.correctivos) state.correctivos=data.correctivos;
    if(data.empresas) state.empresas=data.empresas;
    if(data.ingenieros) state.ingenieros=data.ingenieros;
    if(Array.isArray(data.usageLog)) usageLog=data.usageLog;
    if(data.prefs) prefs=Object.assign(prefs,data.prefs);
    promoverBorradores();
    const dropRep=dedupReprogramaciones();
    await persistUsuario(); await persistPrefs(); dirtySinceBackup=false; render(); toast("Respaldo importado."+(dropRep?` ${dropRep} reprog. duplicada(s) descartada(s).`:""));
  }catch(e){ toast("Error importando JSON: "+e.message); }
}
async function importOldBackupData(data){ const blob=new File([JSON.stringify(data)],"b.json"); return importOldBackup(blob); }

function exportTableXLSX(rows, name){
  if(!rows || !rows.length){ toast("Nada que exportar."); return; }
  // normalizar: si rows son equipos crudos, mapear columnas visibles
  let data=rows;
  if(rows[0] && rows[0].key && rows[0].prog){
    const cols=visibleEqColumns();
    data=rows.map(e=>{ const o={}; cols.forEach(c=>{ o[c.h]= c.f==="_estado"?estadoEquipo(e.key):(c.f==="_pend"?pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length:(e[c.f]||"")); }); return o; });
  }
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
  XLSX.writeFile(wb, `${name}-${todayISO()}.xlsx`);
}

// Respaldo completo en estructura Excel: un libro .xlsx con una hoja por colección
function buildWorkbook(){
  const wb=XLSX.utils.book_new();
  const addSheet=(rows,name)=>{ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{ "(sin datos)":"" }]); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31)); };

  // Equipos (con estado y nº de pendientes derivados)
  addSheet(state.equipos.map(e=>({
    ID:e.idPlanilla, "N° Carpeta":e.carpeta, "N° Inventario":e.inventario, Equipo:e.equipo, Servicio:e.servicio,
    Unidad:e.unidad, Ubicación:e.ubicacion, Procedencia:e.procedencia, Marca:e.marca, Modelo:e.modelo, "N° Serie":e.serie,
    "Año Instalación":e.anio, "Vida Útil Residual":e.vidaUtil, Clasificación:e.clasif, Familia:e.fam, Frecuencia:e.frecuencia,
    Estado:estadoEquipo(e.key), "Pendientes abiertos": pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length, Fila:e.fila
  })), "Equipos");

  // Mantenciones (detalleMP)
  addSheet(state.detalleMP.map(mpRowForExport), "Mantenciones");

  // Pendientes (+ seguimiento resumido en una columna)
  addSheet(state.pendientes.map(p=>{ const r=pendRowForExport(p);
    r.EnEsperaDe=p.enEsperaDe||""; r.Prioridad=p.prioridad||""; r.Causal=p.causal||"";
    r.Tareas=(p.tareas||[]).map(t=>(t.hecha?"✓ ":"☐ ")+(t.texto||"")).join(" | ");
    r.Seguimiento=(p.seguimiento||[]).map(s=>`${(s.fecha||"").slice(0,10)}: ${s.texto}`).join(" || ");
    r.Creado=p.creado; r.Completado=p.fechaCompletado||""; return r; }), "Pendientes");

  // Correctivos (expedientes)
  addSheet(state.correctivos.map(corrRowForExport), "Correctivos");

  // Avances de correctivos (uno por fila, vinculado al folio)
  const avances=[];
  for(const c of state.correctivos){ const e=equipoByKey(c.equipoKey)||{};
    for(const a of (c.avances||[])) avances.push({ Folio:c.folioSigem, Inventario:e.inventario||"", Equipo:e.equipo||"",
      Fecha:(a.fecha||"").slice(0,10), Tipo:a.tipo, "N°":a.numero||"", Empresa:a.empresa||"", Responsable:a.responsable||"", Detalle:a.detalle||"" }); }
  addSheet(avances, "Avances correctivos");

  // Resumen mes × código
  const { cols, matrix }=resumenMesCodigo();
  addSheet(matrix.map((r,m)=>{ const o={Mes:MESES_LARGO[m]}; cols.forEach(c=>o[c]=r.counts[c]); return o; }), "Resumen mes×código");
  return wb;
}
function exportAllXLSX(){
  XLSX.writeFile(buildWorkbook(), `respaldo-MP2026-${todayISO()}.xlsx`);
  toast("Respaldo Excel exportado.");
}

async function chooseBackupFolder(){

async function saveToFolder(){
  if(!backupDirHandle) return false;
  try{
    // JSON reimportable
    const payload={ tipo:"respaldo-gmp2026-v3", version:3, fecha:new Date().toISOString(), meta:state.meta,
      detalleMP:state.detalleMP, pendientes:state.pendientes, correctivos:state.correctivos, empresas:state.empresas, ingenieros:state.ingenieros, usageLog, usoResumen:resumenUso(), entorno:entornoSesion(), prefs };
    const fhJ=await backupDirHandle.getFileHandle(`respaldo-MP2026.json`,{create:true});
    const wJ=await fhJ.createWritable(); await wJ.write(JSON.stringify(payload,null,2)); await wJ.close();
    // Excel legible (mismo libro de "Respaldar ahora")
    const buf=XLSX.write(buildWorkbook(),{type:"array",bookType:"xlsx"});
    const fhX=await backupDirHandle.getFileHandle(`respaldo-MP2026.xlsx`,{create:true});
    const wX=await fhX.createWritable(); await wX.write(buf); await wX.close();
    dirtySinceBackup=false; changesSinceFolderSave=0;
    return true;
  }catch(e){ console.warn("auto-guardado falló",e); return false; }
}

function diagnosticoDatos(){
  const keys=new Set(state.equipos.map(e=>e.key));
  const orphMP=state.detalleMP.filter(m=>!keys.has(m.equipoKey));
  const orphPend=state.pendientes.filter(p=>!keys.has(p.equipoKey));
  const orphCorr=state.correctivos.filter(c=>!keys.has(c.equipoKey));
  const groups={}; state.pendientes.forEach(p=>{ const k=p.equipoKey+"|"+p.tipo; (groups[k]=groups[k]||[]).push(p); });
  const dups=Object.entries(groups).filter(([k,a])=>a.length>1 && keys.has(a[0].equipoKey)).map(([k,a])=>a);
  return { orphMP, orphPend, orphCorr, dups };
}
function openDiagnostico(){
  const d=diagnosticoDatos();
  const body=el("div");
  const totalOrph=d.orphMP.length+d.orphPend.length+d.orphCorr.length;
  body.appendChild(el("div",{class:"banner "+(totalOrph||d.dups.length?"warn":"info"),style:"margin-top:0"},
    totalOrph||d.dups.length? `Se encontraron ${totalOrph} registro(s) sin equipo en la planilla y ${d.dups.length} grupo(s) de pendientes posiblemente duplicados.` : "Sin problemas: todos los registros enlazan a un equipo y no hay duplicados evidentes. ✅"));

  // Huérfanos
  const secOrph=el("div",{class:"card"});
  secOrph.appendChild(el("h3",{},"Registros sin equipo en la planilla ",el("span",{class:"count"},`(${totalOrph})`)));
  secOrph.appendChild(el("div",{class:"small muted",style:"margin-bottom:8px"},"Su N° Serie/Inventario no existe en el .xlsm cargado (datos de origen con serie inválida, o equipo fuera del programa 2026). Se conservan, pero no aparecen en fichas."));
  if(!totalOrph) secOrph.appendChild(el("div",{class:"small muted"},"Ninguno. ✅"));
  else {
    const tw=el("div",{class:"tablewrap dense",style:"max-height:240px"}); const t=el("table",{class:"grid"});
    t.appendChild(el("thead",{},el("tr",{},...["Clase","Equipo (key)","Detalle","Fuente"].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    d.orphMP.forEach(m=>tb.appendChild(el("tr",{}, el("td",{},"MP"), el("td",{class:"mono"},m.equipoKey), el("td",{class:"small"},(m.resultado||"")+" "+fmtDate(m.fecha)), el("td",{class:"small"},m.fuente||"app"))));
    d.orphPend.forEach(p=>tb.appendChild(el("tr",{}, el("td",{},"Pendiente"), el("td",{class:"mono"},p.equipoKey), el("td",{class:"small"},esc((p.tipoOriginal||p.tipo)+" — "+(p.descripcion||"").slice(0,40))), el("td",{class:"small"},p.fuente||"app"))));
    d.orphCorr.forEach(c=>tb.appendChild(el("tr",{}, el("td",{},"Correctivo"), el("td",{class:"mono"},c.equipoKey), el("td",{class:"small"},"Folio "+(c.folioSigem||"")), el("td",{class:"small"},c.fuente||""))));
    t.appendChild(tb); tw.appendChild(t); secOrph.appendChild(tw);
  }
  body.appendChild(secOrph);

  // Duplicados de pendientes
  const secDup=el("div",{class:"card"});
  secDup.appendChild(el("h3",{},"Pendientes posiblemente duplicados ",el("span",{class:"count"},`(${d.dups.length} grupos)`)));
  secDup.appendChild(el("div",{class:"small muted",style:"margin-bottom:8px"},"Mismo equipo y mismo tipo (suele pasar al importar el respaldo y la planilla integrada). Revisa y borra los repetidos."));
  if(!d.dups.length) secDup.appendChild(el("div",{class:"small muted"},"Ninguno. ✅"));
  else {
    const tw=el("div",{class:"tablewrap dense",style:"max-height:300px"}); const t=el("table",{class:"grid"});
    t.appendChild(el("thead",{},el("tr",{},...["Equipo","Tipo","Fuente","Estado",""].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    d.dups.forEach(grp=> grp.forEach((p,i)=>{ const e=equipoByKey(p.equipoKey);
      tb.appendChild(el("tr",{style:i===0?"border-top:2px solid var(--line)":""},
        el("td",{}, i===0?(e?esc(e.inventario):p.equipoKey):""),
        el("td",{}, el("span",{class:"badge "+origenCls(PEND_TIPOS[p.tipo]?.origen)},PEND_TIPOS[p.tipo]?.label||p.tipo)),
        el("td",{class:"small"}, p.fuente||"app"),
        el("td",{class:"small"}, p.estado),
        el("td",{}, el("div",{class:"tag-row"},
          el("button",{class:"btn sm ghost",onclick:()=>{ closeDrawer(); openPendForm(p); }},"Ver"),
          el("button",{class:"btn sm",title:"Borrar este pendiente",onclick:async()=>{ if(confirm("¿Borrar este pendiente duplicado?")){ const idx=state.pendientes.findIndex(x=>x.id===p.id); if(idx>=0)state.pendientes.splice(idx,1); await markDirty("usuario"); openDiagnostico(); } }},"Borrar")
        ))
      )); }));
    t.appendChild(tb); tw.appendChild(t); secDup.appendChild(tw);
  }
  body.appendChild(secDup);

  openDrawer("Diagnóstico de datos", body, [
    {label:"Descartar reprog. duplicadas", act:async()=>{ const n=dedupReprogramaciones(); await markDirty("usuario"); toast(n?`${n} reprogramación(es) duplicada(s) descartada(s).`:"No había reprogramaciones duplicadas."); openDiagnostico(); render(); }},
    {label:"Exportar diagnóstico", act:()=>{ const rows=[
      ...d.orphMP.map(m=>({Clase:"MP huérfana",Equipo:m.equipoKey,Detalle:m.resultado+" "+m.fecha,Fuente:m.fuente||"app"})),
      ...d.orphPend.map(p=>({Clase:"Pendiente huérfano",Equipo:p.equipoKey,Detalle:(p.tipoOriginal||p.tipo),Fuente:p.fuente||"app"})),
      ...d.orphCorr.map(c=>({Clase:"Correctivo huérfano",Equipo:c.equipoKey,Detalle:"Folio "+c.folioSigem,Fuente:c.fuente||""})),
    ]; exportTableXLSX(rows.length?rows:[{info:"sin huérfanos"}],"Diagnostico"); }},
    {label:"Cerrar", cls:"primary", act:closeDrawer}
  ], {wide:true});
}

  body.appendChild(item("Descargar grabación de uso","Exporta la bitácora + resumen y entorno como JSON para compartir conmigo.",()=>{closeDrawer();downloadUsageLog();}));
  body.appendChild(item("Borrar grabación de uso","Vacía la bitácora de uso registrada.",()=>{closeDrawer();clearUsageLog();}));
  body.appendChild(el("hr",{class:"soft"}));

  body.appendChild(item("Reset total","Borra preferencias, planilla y datos de usuario.",()=>{closeDrawer();resetTotal();},"" ));
  if(state.meta&&state.meta.ignoradosDetalle&&state.meta.ignoradosDetalle.length)
    body.appendChild(el("div",{class:"small muted",style:"margin-top:10px"}, `${state.meta.ignoradosDetalle.length} celdas con datos sucios fueron ignoradas en la última carga.`));
  openDrawer("Acciones", body);
}

/* ------------------------------ Bootstrap -------------------------------- */
function wireUI(){
  $("#btnLoadXlsm").addEventListener("click",()=>$("#fileXlsm").click());
  $("#btnBackupNow").addEventListener("click",respaldarAhora);
  $("#btnRec").addEventListener("click",toggleRecording);
  $("#btnMenu").addEventListener("click",openMenu);
  // Grabación de uso: registra clics en botones/accesos cuando está activa
  document.addEventListener("click",(e)=>{
    if(!recording) return;
    const t=e.target.closest("button,a,.kpi,.heatcell,[data-rec]");
    if(!t || t.id==="btnRec") return;
    const label=(t.getAttribute("data-rec")||t.textContent||"").replace(/\s+/g," ").trim().slice(0,60);
    recordEvent("click", label||t.tagName.toLowerCase());
  },true);
  $("#drawerClose").addEventListener("click",closeDrawer);
  $("#drawerBack").addEventListener("click",closeDrawer);
  $("#fileXlsm").addEventListener("change",e=>{ const f=e.target.files[0]; if(f)importXlsm(f); e.target.value=""; });
  $("#fileJson").addEventListener("change",e=>{ const f=e.target.files[0]; if(f)importJSON(f); e.target.value=""; });
  $("#fileOldBackup").addEventListener("change",e=>{ const f=e.target.files[0]; if(f){closeDrawer();importOldBackup(f);} e.target.value=""; });
  $("#fileIntegrado").addEventListener("change",e=>{ const f=e.target.files[0]; if(f){closeDrawer();importIntegrado(f);} e.target.value=""; });
  $("#fileConsolidado").addEventListener("change",async e=>{ const fs=Array.from(e.target.files); closeDrawer(); for(const f of fs) await importConsolidado(f); e.target.value=""; });

  const SEARCH_VIEWS=["equipos","pendientes","correctivo","preventivo"]; // vistas donde la búsqueda filtra in situ
  let deb;
  $("#globalSearch").addEventListener("input",e=>{ clearTimeout(deb); deb=setTimeout(()=>{ ui.search=e.target.value;
    if(e.target.value.trim()){ recordEvent("buscar",e.target.value.trim());
      // La búsqueda aplica en Equipos, Pendientes y Correctivos; desde otras vistas, saltar a Equipos.
      if(state.equipos.length && !SEARCH_VIEWS.includes(ui.view)){ ui.view="equipos"; recordEvent("nav","Auto → Equipos por búsqueda"); }
    }
    render(); },300); });
  // Enter en la búsqueda: si queda un único equipo, abre su ficha directamente (1 gesto).
  $("#globalSearch").addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    clearTimeout(deb); ui.search=e.target.value;
    if(state.equipos.length && !SEARCH_VIEWS.includes(ui.view)) ui.view="equipos";
    render();
    if(ui.view==="equipos"){ const res=filteredEquipos();
      if(res.length===1){ recordEvent("atajo","Enter → abre único resultado "+res[0].inventario); openFicha(res[0].key); }
      else recordEvent("atajo",`Enter en búsqueda (${res.length} resultados)`); }
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ closeDrawer(); closeFunnel(); }
    // "/" enfoca la búsqueda (atajo de teclado, salvo si ya se escribe en un campo)
    const tag=(document.activeElement&&document.activeElement.tagName)||"";
    if(e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(tag)){ e.preventDefault(); const s=$("#globalSearch"); s.focus(); s.select(); }
  });
  // Al ocultar/cerrar la pestaña: si hay carpeta de auto-guardado, escribir JSON+Excel (mejor esfuerzo);
  // este evento es más fiable que beforeunload para operaciones asíncronas.
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ persistUsuario(); if(backupDirHandle && dirtySinceBackup) saveToFolder(); } });
  window.addEventListener("pagehide",()=>{ persistUsuario(); if(backupDirHandle && dirtySinceBackup) saveToFolder(); });
  // Aviso al cerrar SOLO si hay cambios y no hay auto-guardado a carpeta activo.
  window.addEventListener("beforeunload",e=>{ if(dirtySinceBackup && !backupDirHandle){ e.preventDefault(); e.returnValue=""; } });
}

async function resetSilencioso(){
  await idbDel(LS_PREF); await idbDel(LS_DATOS); await idbDel(LS_USUARIO);
  try{ localStorage.removeItem(LS_PREF); localStorage.removeItem(LS_DATOS); localStorage.removeItem(LS_USUARIO);}catch(e){}
  state={ equipos:[],registros:[],detalleMP:[],pendientes:[],correctivos:[],empresas:[],ingenieros:[],meta:null };
  prefs={ columnasEquipos:null, columnasHistorial:null, ultimoEjecutor:"", ultimoTipoMant:"Interno", ultimaEmpresa:"", ultimoIngeniero:"" };
  usageLog=[]; dirtySinceBackup=false; invalidarIndices();
}
(async function init(){
  wireUI();
  // Arranque limpio con #reset (abre index.html#reset para empezar sin datos)
  if(location.hash.replace("#","").toLowerCase()==="reset"){
    await resetSilencioso();
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    toast("Iniciado sin datos. Carga el .xlsm para comenzar.");
  } else {
    await loadAll();
  }
  recordEvent("session","▶ Apertura · "+entornoSesion().pantalla+" · equipos:"+state.equipos.length);
  render();
})();
</script>
