<!-- Sin dependencias de red: tipografía IBM Plex si está instalada, si no, system-ui. -->
<style>
/* ============================================================================
   Gestión MP 2026 — rediseño UX/UI «Consola clínica»
   Sistema visual nuevo (CSS + shell). El motor (JS) se conserva intacto, por lo
   que se mantienen los nombres de variables y de clases que el código emite.
   Dirección: consola de operaciones biomédicas — base slate fría, un acento
   cobalto, paleta de estado estricta, lecturas tipo instrumento, LEDs de
   operatividad e identidad monoespaciada (IBM Plex Mono) para los activos.
   ========================================================================== */
:root{
  /* — superficies y tinta (slate frío) — */
  --bg:#e8ecf2; --surface:#ffffff; --panel:#f2f5f9;
  --ink:#1a2734; --muted:#566374; --faint:#8794a4;
  --line:#dbe1ea; --line-soft:#e8edf3;

  /* — acento cobalto clínico — */
  --accent:#15568f; --accent-ink:#0f3f6b; --accent-tint:#e7eef7;

  /* — paleta de estado (estricta, baja fatiga) — */
  --ok:#2e8b4f;   --ok-tint:#e6f3ea;
  --warn:#a9720c; --warn-tint:#fbf0d8;
  --bad:#bb3a2c;  --bad-tint:#fbe6e1;
  --info:#6b4fbf; --info-tint:#ece8f9;
  --draft:#8a6420;--draft-tint:#f6edd7;

  /* — LEDs de operatividad (luminosos, con halo) — */
  --led-ok:#34a85a; --led-warn:#e3a017; --led-bad:#df4b37; --led-idle:#a3aebd;

  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  --shadow-sm:0 1px 2px rgba(20,36,54,.05);
  --shadow-md:0 4px 14px rgba(20,36,54,.08), 0 1px 3px rgba(20,36,54,.05);
  --shadow-lg:0 18px 44px rgba(20,36,54,.18);
  --shadow-head:0 6px 14px -10px rgba(20,36,54,.45);
  --accent-grad:linear-gradient(135deg,#1c6aa6,#103f6b);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 480px at 78% -8%, #eef3f8 0%, rgba(238,243,248,0) 60%),
    var(--bg);
  color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink)}
::selection{background:rgba(21,86,143,.18)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* scrollbars discretos (consola) */
*{scrollbar-width:thin; scrollbar-color:#c4ccd8 transparent}
*::-webkit-scrollbar{width:11px; height:11px}
*::-webkit-scrollbar-thumb{background:#c4ccd8; border:3px solid transparent; background-clip:padding-box; border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#aab4c4; background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ======================= Barra superior (comando) ======================= */
.topbar{
  position:relative; background:var(--surface); border-bottom:1px solid var(--line);
  padding:9px 18px 9px 16px; display:flex; align-items:center; gap:16px; flex:none;
  box-shadow:var(--shadow-head); z-index:20;
}
.topbar::before{ /* riel de acento del instrumento */
  content:""; position:absolute; left:0; right:0; top:0; height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-ink) 70%); opacity:.95;
}
.brand{display:flex; align-items:center; gap:11px; white-space:nowrap}
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent-grad); color:#fff;
  display:inline-grid; place-items:center; font-family:var(--mono); font-weight:600;
  font-size:13px; letter-spacing:.04em; box-shadow:inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-sm);
}
.brand-text{display:flex; flex-direction:column; line-height:1.05}
.brand-text{font-weight:700; font-size:14.5px; letter-spacing:-.01em}
.brand-text small{font-weight:500; font-size:10.5px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase; margin-top:2px}

.search{flex:1; position:relative; max-width:620px}
.search input{
  width:100%; padding:10px 40px 10px 38px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); outline:none; color:var(--ink);
  transition:border-color .14s, background .14s, box-shadow .14s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-tint)}
.search::before{content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:18px; color:var(--faint)}
.search::after{content:"/"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font:600 11px/1 var(--mono); color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:3px 6px; background:var(--surface)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none}
.search:focus-within::after{opacity:0}

.topactions{display:flex; gap:7px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:8px 13px; border-radius:8px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:background .12s, border-color .12s, color .12s, box-shadow .12s, transform .04s;
}
.btn:hover{background:var(--panel); border-color:#cdd5e0}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 1px 0 rgba(255,255,255,.12) inset, var(--shadow-sm)}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
.btn.sm{padding:5px 10px; font-size:12px; border-radius:7px}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--panel)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
/* ============================== Estructura ============================== */
.shell{display:flex; flex:1; min-height:0}
.nav{
  width:206px; background:var(--surface); border-right:1px solid var(--line);
  padding:12px 10px; flex:none; overflow:auto; display:flex; flex-direction:column; gap:3px;
}
.nav button{
  position:relative; display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  border:none; background:transparent; padding:9px 11px 9px 12px; border-radius:8px;
  color:var(--muted); font-size:13.5px; font-weight:500; transition:background .12s, color .12s;
}
.nav button .ico{
  width:24px; height:24px; flex:none; display:inline-grid; place-items:center;
  font-size:14px; color:var(--faint); border-radius:6px; background:var(--panel); transition:color .12s, background .12s;
}
.nav button:hover{background:var(--panel); color:var(--ink)}
.nav button:hover .ico{color:var(--accent)}
.nav button.active{background:var(--accent-tint); color:var(--accent-ink); font-weight:600}
.nav button.active .ico{background:#fff; color:var(--accent)}
.nav button.active::before{ /* marcador de canal seleccionado */
  content:""; position:absolute; left:-10px; top:7px; bottom:7px; width:3px; border-radius:0 3px 3px 0; background:var(--accent);
}
.nav .navbadge{
  margin-left:auto; font:600 11px/1 var(--mono); background:var(--bad); color:#fff;
  border-radius:20px; padding:3px 7px; min-width:20px; text-align:center; letter-spacing:.02em;
}
.nav .navsep{height:1px; background:var(--line-soft); margin:11px 6px 7px}
.nav .navhint{font-size:11px; color:var(--faint); padding:3px 12px; line-height:1.4}
.nav .navhint:first-of-type{margin-top:6px; color:var(--muted); font-weight:600; letter-spacing:.02em}

.main{flex:1; min-width:0; overflow:auto; padding:20px 22px 56px}
.view{max-width:none; margin:0}
.view h2{font-size:19px; margin:0 0 2px; letter-spacing:-.015em; font-weight:700}
.viewhead{display:flex; align-items:baseline; gap:12px; margin-bottom:18px; flex-wrap:wrap; position:relative; padding-left:14px}
.viewhead::before{content:""; position:absolute; left:0; top:3px; bottom:3px; width:4px; border-radius:3px; background:var(--accent-grad)}
.viewhead .sub{color:var(--muted); font-size:13px}
.spacer{flex:1}

/* ====================== Banda de KPIs (instrumentos) ==================== */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:20px}
.kpi{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px 14px; cursor:pointer; overflow:hidden; box-shadow:var(--shadow-sm);
  transition:border-color .14s, box-shadow .14s, transform .14s;
}
.kpi::before{ /* franja de estado superior */
  content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--accent); opacity:.85;
}
.kpi.ok::before{background:var(--led-ok)} .kpi.warn::before{background:var(--led-warn)} .kpi.alert::before{background:var(--led-bad)}
.kpi:hover{border-color:#c6cfdb; box-shadow:var(--shadow-md); transform:translateY(-2px)}
.kpi .k-label{font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.07em; text-transform:uppercase}
.kpi .k-val{font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1.05; margin-top:7px; font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11.5px; color:var(--faint); margin-top:4px}
.kpi.alert .k-val{color:var(--bad)} .kpi.warn .k-val{color:var(--warn)} .kpi.ok .k-val{color:var(--ok)}

/* ================================ Tarjetas ============================== */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow-sm)}
.card h3{margin:0 0 12px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:9px; letter-spacing:-.005em}
.card h3::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--accent); flex:none}
.card h3 .count{font:600 11.5px/1 var(--mono); color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:3px 8px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}

/* ================================= Tablas ============================== */
.tablewrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow-sm)}
.card .tablewrap{box-shadow:none}
table.grid{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; table-layout:auto}
/* El texto de las celdas SE AJUSTA a la vista (no se amontona ni desborda). Solo
   permanecen en una línea: encabezados, fechas/números, mono (inventario/serie) y badges. */
table.grid th, table.grid td{padding:7px 11px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:normal; overflow-wrap:break-word; vertical-align:top; line-height:1.4}
table.grid thead th, table.grid td.nowrap, table.grid td.num, table.grid td.mono, table.grid td .mono, table.grid td .badge{white-space:nowrap}
table.grid td.mono, table.grid td .mono{overflow-wrap:normal}
.nowrap{white-space:nowrap}
table.grid thead th{
  position:sticky; top:0; background:var(--panel); z-index:2; font-size:10.5px;
  font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase;
  border-bottom:1.5px solid var(--line); user-select:none;
}
table.grid thead th .th-inner{display:flex; align-items:center; gap:6px}
table.grid thead th .sortable{cursor:pointer; transition:color .12s}
table.grid thead th .sortable:hover{color:var(--accent-ink)}
table.grid thead th .funnel{cursor:pointer; color:var(--faint); font-size:12px; padding:1px 4px; border-radius:5px; transition:color .12s, background .12s}
table.grid thead th .funnel:hover{color:var(--accent); background:var(--accent-tint)}
table.grid thead th .funnel.on{color:#fff; background:var(--accent)}
table.grid tbody tr{transition:background .1s}
table.grid tbody tr:hover{background:var(--accent-tint)}
table.grid tbody tr.clickable{cursor:pointer}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid td.num{text-align:right; font-variant-numeric:tabular-nums}
.dense table.grid th, .dense table.grid td{padding:4px 10px}
.mono{font-family:var(--mono); font-size:11.5px; letter-spacing:-.01em}
td .faint.mono, .faint.mono{color:var(--faint)}

/* ================================ Badges =============================== */
.badge{display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; line-height:1.5; white-space:nowrap; letter-spacing:.01em}
.b-ok{background:var(--ok-tint); color:var(--ok)}
.b-warn{background:var(--warn-tint); color:var(--warn)}
.b-bad{background:var(--bad-tint); color:var(--bad)}
.b-info{background:var(--info-tint); color:var(--info)}
.b-draft{background:var(--draft-tint); color:var(--draft)}
.b-neutral{background:var(--panel); color:var(--muted); border:1px solid var(--line)}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; background:var(--led-idle)}
.dot.ok{background:var(--led-ok); box-shadow:0 0 0 3px rgba(52,168,90,.16)}
.dot.warn{background:var(--led-warn); box-shadow:0 0 0 3px rgba(227,160,23,.16)}
.dot.bad{background:var(--led-bad); box-shadow:0 0 0 3px rgba(223,75,55,.16)}

/* ============================== Barra de filtros ======================= */
.filterbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.filterbar select, .filterbar input{
  padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
  outline:none; transition:border-color .12s, box-shadow .12s;
}
.filterbar select:focus, .filterbar input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
.chip-x{background:var(--accent-tint); color:var(--accent-ink); border:1px solid #cbddee;
  border-radius:20px; padding:4px 6px 4px 11px; font-size:12px; font-weight:600; display:inline-flex; gap:7px; align-items:center}
.chip-x button{border:none; background:rgba(15,63,107,.1); color:var(--accent-ink); font-weight:700; padding:0; width:16px; height:16px; border-radius:50%; line-height:1; display:grid; place-items:center}
.chip-x button:hover{background:rgba(15,63,107,.2)}

/* ============================ Menú embudo (filtro) ===================== */
.funnelmenu{
  position:absolute; z-index:50; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; box-shadow:var(--shadow-lg); padding:9px; min-width:210px; max-height:340px; overflow:auto;
}
.funnelmenu .fm-search{width:100%; margin-bottom:7px; padding:6px 9px; border:1px solid var(--line); border-radius:7px; outline:none}
.funnelmenu .fm-search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
.funnelmenu label{display:flex; gap:8px; align-items:center; padding:5px 6px; font-size:12.5px; border-radius:6px; cursor:pointer}
.funnelmenu label:hover{background:var(--panel)}
.funnelmenu .fm-actions{display:flex; gap:7px; margin-top:8px; border-top:1px solid var(--line-soft); padding-top:9px}
input[type=checkbox]{accent-color:var(--accent)}

/* ===================== Drawer / panel (fichas y formularios) =========== */
.drawer-back{position:fixed; inset:0; background:rgba(18,28,40,.36); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:80; display:none; opacity:0; transition:opacity .18s}
.drawer-back.open{display:block; opacity:1}
.drawer{
  position:fixed; top:50%; left:50%; width:min(640px,94vw); max-height:92vh; background:var(--bg);
  z-index:90; border-radius:14px; overflow:hidden;
  transform:translate(-50%,-46%) scale(.985); opacity:0; pointer-events:none;
  transition:transform .18s cubic-bezier(.22,.61,.36,1), opacity .16s;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
}
.drawer.wide{width:min(1040px,94vw)}
.drawer.open{transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto}
.drawer-head{
  position:relative; background:var(--surface); border-bottom:1px solid var(--line); padding:14px 20px;
  display:flex; align-items:center; gap:10px; flex:none;
}
.drawer-head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent-grad)}
.drawer-head h3{margin:0; font-size:16px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em}
.drawer-body{overflow-y:auto; overflow-x:hidden; padding:18px 20px 64px; flex:1; min-width:0}
.drawer-body table.grid td, .drawer-body table.grid th{white-space:normal; overflow-wrap:break-word; word-break:normal}
.drawer-body .tablewrap{overflow-x:auto; max-width:100%}
.drawer-body .kv{grid-template-columns:minmax(120px,auto) 1fr}
.drawer-body .kv dd{word-break:break-word; min-width:0}
.drawer-body .copybox{white-space:pre-wrap; word-break:break-word}

/* ================================= Forms =============================== */
.field{margin-bottom:14px}
.field label, .field-label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:.04em; text-transform:uppercase}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--surface); outline:none;
  transition:border-color .12s, box-shadow .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
.field textarea{min-height:66px; resize:vertical; line-height:1.5}
.field .hint{font-size:11.5px; color:var(--faint); margin-top:4px; text-transform:none; letter-spacing:0; font-weight:400}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:13px}
.frow3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:13px}
@media(max-width:620px){.frow,.frow3{grid-template-columns:1fr}}
.formsection{position:relative; border-top:1px solid var(--line-soft); margin-top:14px; padding-top:14px}
.formsection h4{margin:0 0 12px; font-size:11px; color:var(--accent-ink); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.check{display:flex; gap:9px; align-items:center; font-size:13.5px; margin-bottom:9px}
.check input{width:auto}

/* ============================ Timeline (ficha) ========================= */
.timeline td .tl-ico{font-size:14px}
.tl-mp{color:var(--ok)} .tl-pend{color:var(--warn)} .tl-corr{color:var(--accent)}

/* ========================= Bitácora / seguimiento ====================== */
.bitacora{border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:10px 12px}
.bitacora .entry{padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; line-height:1.5}
.bitacora .entry:last-child{border-bottom:none}
.bitacora .entry .when{font:600 11px/1 var(--mono); color:var(--faint); margin-bottom:2px; display:block}
.bita-add{display:flex; gap:7px; margin-top:10px}
.bita-add input{flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; outline:none}
.bita-add input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}

/* ================================ Tasks ================================ */
.tasklist{list-style:none; padding:0; margin:8px 0}
.tasklist li{display:flex; gap:9px; align-items:center; padding:5px 0; font-size:13px}

/* ============================= Utilidades ============================== */
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.right{text-align:right} .center{text-align:center}
.empty{padding:54px 24px; text-align:center; color:var(--faint)}
.empty .big{font-size:42px; margin-bottom:12px; opacity:.4; line-height:1}
.pill{font:500 11px/1 var(--mono); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:4px 10px; color:var(--muted)}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:500; z-index:200; box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-5px)}
.colsel{max-height:300px; overflow:auto}
.copybox{width:100%; min-height:130px; font-family:var(--mono); font-size:12px; white-space:pre; padding:12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); outline:none; line-height:1.6}
.copybox:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
.heatcell{cursor:pointer; text-align:center; font-variant-numeric:tabular-nums; transition:outline .1s}
.heatcell:hover{outline:2px solid var(--accent); outline-offset:-2px}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.banner{padding:11px 15px; border-radius:10px; margin-bottom:14px; font-size:13px; display:flex; gap:11px; align-items:center; border:1px solid transparent}
.banner.warn{background:var(--warn-tint); color:var(--warn); border-color:#efd9ad}
.banner.info{background:var(--info-tint); color:var(--info); border-color:#d8cdf0}
.banner .spacer{flex:1}
.tag-row{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
hr.soft{border:none; border-top:1px solid var(--line-soft); margin:16px 0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:13px}
.kv dt{color:var(--muted); font-weight:600; font-size:11px; letter-spacing:.03em; text-transform:uppercase; align-self:center}
.kv dd{margin:0}
.fileinput{display:none}

/* ============================== Responsive ============================= */
/* Alertas y recordatorios */
.alert-badge{position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 4px; border-radius:9px;
  background:var(--bad); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--surface)}
#btnAlerts.has-alerts{border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
.alert-row{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px;
  border:1px solid var(--line); border-left-width:4px; border-radius:var(--radius); background:var(--surface); cursor:pointer; transition:background .12s, box-shadow .12s}
.alert-row:hover{background:var(--panel); box-shadow:var(--shadow-sm)}
.alert-row.sev-alert{border-left-color:var(--bad)} .alert-row.sev-warn{border-left-color:var(--warn)}
.alert-row .a-n{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; min-width:42px; text-align:center}
.alert-row.sev-alert .a-n{color:var(--bad)} .alert-row.sev-warn .a-n{color:var(--warn)}
.alert-row .a-main{flex:1; min-width:0}
.alert-row .a-title{font-weight:600; font-size:13.5px}
.alert-row .a-sub{font-size:11.5px; color:var(--muted); margin-top:1px}
.alert-row .a-go{color:var(--faint); font-size:18px; flex:0 0 auto}

/* Barra lateral contraíble (a modo icono); la preferencia se recuerda. */
.nav{transition:width .18s ease}
[data-nav="collapsed"] .nav{width:60px; padding:12px 8px}
[data-nav="collapsed"] .nav button{justify-content:center; padding:9px 0}
[data-nav="collapsed"] .nav button > span:not(.ico):not(.navbadge){display:none}
[data-nav="collapsed"] .nav button.active::before{left:-8px}
[data-nav="collapsed"] .nav .navbadge{position:absolute; top:3px; right:6px; margin:0; min-width:16px; padding:2px 5px; font-size:10px}
[data-nav="collapsed"] .nav .navsep{margin:8px 12px}
[data-nav="collapsed"] .nav .navhint{display:none}
#btnNav{flex:0 0 auto}

@media(max-width:880px){
  .main{padding:18px 16px 48px}
  .nav{width:66px; padding:12px 8px}
  .nav button{justify-content:center; padding:9px 0}
  .nav button > span:not(.ico):not(.navbadge){display:none}
  .nav button.active::before{left:-8px}
  .nav .navbadge{position:absolute; top:3px; right:6px; margin:0; min-width:16px; padding:2px 5px; font-size:10px}
  .nav .navsep, .nav .navhint{display:none}
  .brand-text{display:none}
}
@media(max-width:560px){
  .topbar{flex-wrap:wrap; gap:10px; padding:9px 14px}
  .search{order:3; flex-basis:100%; max-width:none}
  .search::after{display:none}
}
/* Responsive: en pantallas estrechas las tablas se apilan en tarjetas legibles
   (cada celda muestra su etiqueta) en vez de amontonar muchas columnas. */
@media(max-width:720px){
  .drawer, .drawer.wide{width:100%; max-width:100%; height:100%; max-height:100%; border-radius:0}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .tablewrap{overflow-x:hidden}
  table.grid{min-width:0}
  table.grid thead{display:none}
  table.grid, table.grid tbody{display:block; width:100%}
  table.grid tbody tr{display:block; background:var(--surface); border-bottom:none; box-shadow:inset 0 0 0 1px var(--line); border-radius:var(--radius-sm); margin:0 0 8px; padding:4px 0}
  table.grid tbody tr:hover{background:var(--surface)}
  table.grid td{display:flex; gap:10px; align-items:flex-start; border:none; padding:5px 12px; white-space:normal; font-size:12.5px}
  table.grid td::before{content:attr(data-label); flex:0 0 38%; max-width:38%; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); white-space:normal; line-height:1.25; padding-top:2px}
  table.grid td:not([data-label])::before, table.grid td[data-label=""]::before{display:none}
  table.grid td:empty{display:none}
  table.grid td.mono{overflow-wrap:anywhere}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}

/* ============================================================================
 * Extras de UX (capa añadida): tema oscuro, densidad, paleta ⌘K, teclado j/k.
 * Reutiliza los tokens y clases de «Consola clínica»; no cambia la lógica.
 * ==========================================================================*/

/* ----------------------------- Tema oscuro (slate/cobalto) -------------- */
[data-theme="dark"]{
  --bg:#0c121a; --surface:#121a25; --panel:#172230;
  --ink:#e6ecf3; --muted:#9aa8ba; --faint:#6b7a8d;
  --line:#243243; --line-soft:#1b2735;
  --accent:#4c9be8; --accent-ink:#3d83cb; --accent-tint:#15273a;
  --ok:#46b06a;   --ok-tint:#102a1b;
  --warn:#d79a2b; --warn-tint:#2c2110;
  --bad:#e06a58;  --bad-tint:#2e1714;
  --info:#9a86e0; --info-tint:#1f1a33;
  --draft:#c9a24e;--draft-tint:#2a2212;
  --led-ok:#3fcf6b; --led-warn:#f0b53c; --led-bad:#f0664f; --led-idle:#5b6a7d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 18px 44px rgba(0,0,0,.62);
  --shadow-head:0 6px 14px -10px rgba(0,0,0,.8);
  --accent-grad:linear-gradient(135deg,#3d83cb,#1c4e7e);
}
[data-theme="dark"] body{ background:radial-gradient(1200px 480px at 78% -8%, #122031 0%, rgba(12,18,26,0) 60%), var(--bg); }
[data-theme="dark"] .btn:hover{ border-color:#33445a; }
[data-theme="dark"] .search input:focus{ background:var(--panel); }
[data-theme="dark"] .nav button.active .ico{ background:var(--surface); }
[data-theme="dark"] *{ scrollbar-color:#33445a transparent; }
[data-theme="dark"] *::-webkit-scrollbar-thumb{ background:#33445a; }

/* ----------------------------- Densidad (compacta opcional) ------------- */
[data-density="compacto"] body{ font-size:12.5px; }
[data-density="compacto"] table.grid{ font-size:12px; }
[data-density="compacto"] table.grid th,[data-density="compacto"] table.grid td{ padding:4px 9px; }
[data-density="compacto"] .nav button{ padding:7px 10px; }
[data-density="compacto"] .kpi{ padding:11px 13px; }
[data-density="compacto"] .card{ padding:12px 14px; margin-bottom:11px; }
[data-density="compacto"] .field input,[data-density="compacto"] .field select,[data-density="compacto"] .field textarea{ padding:6px 9px; }
[data-density="compacto"] .btn{ padding:6px 11px; }

/* ----------------------------- Botón icono / tecla ---------------------- */
.btn.icon{ padding:0; width:36px; display:inline-flex; align-items:center; justify-content:center; font-size:15px; }
.btn.sm.icon{ width:30px; }
.kbd{ font-family:var(--mono); font-size:10.5px; background:var(--surface); border:1px solid var(--line);
  border-bottom-width:2px; border-radius:5px; padding:0 5px; color:var(--muted); }

/* ----------------------------- Navegación j/k --------------------------- */
table.grid tbody tr.kb-focus{ background:var(--accent-tint); }
table.grid tbody tr.kb-focus td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }

/* ----------------------------- Paleta de comandos (⌘K) ------------------ */
.cmdk-scrim{ position:fixed; inset:0; background:rgba(12,20,30,.45); z-index:120; display:none; }
.cmdk-scrim.on{ display:block; }
.cmdk{ position:fixed; top:12vh; left:50%; transform:translateX(-50%); width:620px; max-width:92vw; z-index:121;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); overflow:hidden; animation:cmdk-in .15s ease; }
.cmdk input{ width:100%; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:14px 16px; font-size:15px; background:var(--surface); color:var(--ink); outline:none; }
.cmdk input:focus{ box-shadow:none; }
.cmdk-list{ max-height:56vh; overflow-y:auto; padding:6px; }
.cmdk-sec{ font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--faint); padding:8px 10px 4px; font-weight:700; }
.cmdk-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm); cursor:pointer; }
.cmdk-item .c-ico{ width:20px; color:var(--muted); text-align:center; font-size:14px; flex:0 0 auto; }
.cmdk-item .c-main{ flex:1; min-width:0; }
.cmdk-item .c-title{ font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmdk-item .c-sub{ font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmdk-item.on{ background:var(--accent-tint); }
.cmdk-item.on .c-ico,.cmdk-item.on .c-title{ color:var(--accent); }
.cmdk-empty{ padding:20px; text-align:center; color:var(--faint); font-size:13px; }
@keyframes cmdk-in{ from{ opacity:0; transform:translateX(-50%) translateY(-8px) scale(.985); } to{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }
</style>
<!-- Aplica tema y densidad guardados antes de pintar, para evitar parpadeo. -->

/* ----------------------------- Constantes -------------------------------- */

  "Carlos Bahamondes Seguel","Cristián Beltrán Oviedo","Cristina Rozas Urrutia","Daniel Díaz Neira",
  "Ignacio Berner Bergara","Macarena Toledo","Marco Ulloa","Matías Soazo Garrido",
  "Ricardo Matus Aroca","Tito Millapán Riquelme","Personal Externo"
];

// Tipos de pendiente (5 tipos / 3 orígenes)

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null&&attrs[k]!==false) e.setAttribute(k,attrs[k]);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue;
    e.appendChild(typeof kid==="object"?kid:document.createTextNode(String(kid))); }
  return e;
}
function fmtDate(iso){ if(!iso) return ""; const d=String(iso).slice(0,10); const p=d.split("-"); return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:d; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }

/* ----------------------- Normalización de códigos ------------------------ */
function normProg(raw){
  if(raw==null) return "";
  let v=String(raw).trim().toUpperCase();
  if(v==="") return "";
  if(["X","R","RA","PM"].includes(v)) return v==="X"?"X":v; // keep case (X/R/RA/PM)
  return ""; // dato sucio → ignorar
}
function normResult(raw){
  if(raw==null) return "";
  let v=String(raw).trim();
  if(v==="") return "";
  const up=v.toUpperCase().replace(/\s+/g,"");
  if(up==="SI"||up==="SÍ") return "Si";
  if(up==="SI-RA"||up==="SÍ-RA"||up==="SIRA") return "Si-RA";
  if(/^C[1-8]$/.test(up)) return up;
  if(up==="FS") return "FS";
  if(up==="NO") return "No";
  if(up==="NU") return "NU";
  if(up==="BAJA") return "Baja";
  return ""; // dato sucio → ignorar
}

/* ----------------------- Clave de identidad equipo ----------------------- */
function equipoKeyFrom(serie, inventario){
  const s = (serie==null?"":String(serie)).trim();
  if(s) return "S:"+s.toUpperCase();
  const i = (inventario==null?"":String(inventario)).trim();
  return "I:"+i.toUpperCase();
}

/* =========================================================================
   PERSISTENCIA  (IndexedDB principal + localStorage respaldo)
   Tres claves lógicas: LS_PREF, LS_DATOS (planilla cruda), LS_USUARIO
   ========================================================================= */
const DB_NAME="gmp2026", DB_STORE="kv";
const LS_PREF="gmp2026_pref", LS_DATOS="gmp2026_datos", LS_USUARIO="gmp2026_usuario";

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbGet(key){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return undefined; } }
async function idbSet(key,val){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).put(val,key); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){ /* ignore */ } }
async function idbDel(key){ try{ const db=await idbOpen(); return await new Promise((res)=>{ const t=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).delete(key); t.onsuccess=()=>res(); t.onerror=()=>res(); }); }catch(e){} }

function lsSet(key,obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ /* file:// quota */ } }
function lsGet(key){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):undefined; }catch(e){ return undefined; } }

async function persistDatos(){
  const datos = { equipos: state.equipos, registros: state.registros, meta: state.meta };
  await idbSet(LS_DATOS, datos); lsSet(LS_DATOS, datos);
}
async function persistUsuario(){

  await idbSet(LS_USUARIO, u); lsSet(LS_USUARIO, u);
}
async function persistPrefs(){ await idbSet(LS_PREF, prefs); lsSet(LS_PREF, prefs); }

let _recuperable = null; // trabajo de una sesión anterior en este navegador (no aplicado)

// Arranque: SOLO se restauran las PREFERENCIAS (tema, densidad, columnas…). Los datos
// NO se auto-restauran: la app parte vacía y cada día se cargan la programación (.xlsm)
// y el respaldo (JSON). Si quedó trabajo sin exportar de una sesión anterior en este
// navegador, se detecta y se ofrece recuperarlo de forma opcional (red de seguridad).
async function loadAll(){
  let p = await idbGet(LS_PREF) || lsGet(LS_PREF);
  if(p) prefs = Object.assign(prefs, p);
  try{
    const d = await idbGet(LS_DATOS) || lsGet(LS_DATOS);
    const u = await idbGet(LS_USUARIO) || lsGet(LS_USUARIO);
    const hayDatos = (d && (d.equipos||[]).length) || (u && ((u.detalleMP||[]).length||(u.pendientes||[]).length||(u.correctivos||[]).length));
    if(hayDatos) _recuperable = { d, u };
  }catch(e){}
}
// Restaura, a petición, el trabajo no exportado de la sesión anterior (opt-in).
function recuperarSesion(){
  if(!_recuperable) return;
  const { d, u } = _recuperable;
  if(d){ state.equipos=d.equipos||[]; state.registros=d.registros||[]; state.meta=d.meta||null; }
  if(u){ state.detalleMP=u.detalleMP||[]; state.pendientes=u.pendientes||[]; state.correctivos=u.correctivos||[]; state.empresas=u.empresas||[]; state.ingenieros=u.ingenieros||[]; state.eventosEstado=u.eventosEstado||[]; }
  _recuperable=null; invalidarIndices(); dirtySinceBackup=false; render();
  toast("Trabajo de la última sesión recuperado.");
}
async function markDirty(persist="usuario"){
  dirtySinceBackup = true;
  invalidarIndices();
  if(persist==="usuario") await persistUsuario();
  else if(persist==="datos") await persistDatos();
  changesSinceFolderSave++;
  if(backupDirHandle && changesSinceFolderSave>=8){ saveToFolder(); }
}

  await idbDel(LS_PREF); await idbDel(LS_DATOS); await idbDel(LS_USUARIO);
  try{ localStorage.removeItem(LS_PREF); localStorage.removeItem(LS_DATOS); localStorage.removeItem(LS_USUARIO);}catch(e){}
  state={ equipos:[],registros:[],detalleMP:[],pendientes:[],correctivos:[],empresas:[],ingenieros:[],meta:null,eventosEstado:[] };
  prefs={ columnasEquipos:null, ultimoEjecutor:"", ultimoTipoMant:"Interno", ultimaEmpresa:"", ultimoIngeniero:"" };

/* =========================================================================
   LECTURA DEL .xlsm  (SheetJS) — solo lectura
   ========================================================================= */
async function importXlsm(file){
  if(!ensureXLSX()) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    if(!wb.Sheets["PMP_2026"] || !wb.Sheets["Registro_MP-2026"]){
      toast("El archivo no tiene las hojas PMP_2026 y Registro_MP-2026."); return;
    }
    const avisos=[]; const ignorados=[];
    const pmp = XLSX.utils.sheet_to_json(wb.Sheets["PMP_2026"], { header:1, raw:false, defval:"" });
    const reg = XLSX.utils.sheet_to_json(wb.Sheets["Registro_MP-2026"], { header:1, raw:false, defval:"" });

    // --- equipos desde PMP_2026 (encabezados fila 7 => idx 6, datos desde fila 8 => idx 7)
    const equipos=[]; const byKey={};
    for(let i=7;i<pmp.length;i++){
      const row=pmp[i]; if(!row) continue;
      const inv=String(row[COL.inventario]??"").trim();
      const serie=String(row[COL.serie]??"").trim();
      const equipoNom=String(row[COL.equipo]??"").trim();
      if(!inv && !serie && !equipoNom) continue; // fila vacía
      const key=equipoKeyFrom(serie, inv);
      const prog={};
      for(let m=0;m<12;m++){
        const v=normProg(row[PMP_MES0+m]);
        const rawv=row[PMP_MES0+m];
        if(v) prog[m]=v;
        else if(rawv!=null && String(rawv).trim()!=="") ignorados.push({hoja:"PMP_2026",fila:i+1,col:MESES[m],valor:String(rawv).trim()});
      }
      const eq={
        key, fila:i+1, idPlanilla:String(row[COL.idPlanilla]??"").trim(), carpeta:String(row[COL.carpeta]??"").trim(),
        inventario:inv, equipo:equipoNom, servicio:String(row[COL.servicio]??"").trim(), unidad:String(row[COL.unidad]??"").trim(),
        ubicacion:String(row[COL.ubicacion]??"").trim(), procedencia:String(row[COL.procedencia]??"").trim(),
        marca:String(row[COL.marca]??"").trim(), modelo:String(row[COL.modelo]??"").trim(), serie,
        anio:String(row[COL.anio]??"").trim(), vidaUtil:String(row[COL.vidaUtil]??"").trim(),
        clasif:String(row[COL.clasif]??"").trim(), enuBaja:String(row[COL.enuBaja]??"").trim(),
        fam:String(row[COL.fam]??"").trim(), frecuencia:String(row[COL.frecuencia]??"").trim(),
        prog, reg:""
      };
      if(!byKey[key]){ equipos.push(eq); byKey[key]=eq; }
    }

    // --- registros desde Registro_MP-2026 (pares P/R), ignorar columnas tras AR(43)
    const registros=[];
    for(let i=7;i<reg.length;i++){
      const row=reg[i]; if(!row) continue;
      const inv=String(row[COL.inventario]??"").trim();
      const serie=String(row[COL.serie]??"").trim();
      if(!inv && !serie) continue;
      const key=equipoKeyFrom(serie, inv);
      const obsFila=String(row[43]??"").trim(); // AR
      for(let m=0;m<12;m++){
        const pRaw=row[REG_P0+2*m], rRaw=row[REG_R0+2*m];
        const programa=normProg(pRaw);
        const resultado=normResult(rRaw);
        if(rRaw!=null && String(rRaw).trim()!=="" && !resultado)
          ignorados.push({hoja:"Registro_MP-2026",fila:i+1,col:MESES[m]+" R",valor:String(rRaw).trim()});
        if(!programa && !resultado) continue;
        registros.push({ equipoKey:key, mes:m, programa, resultado, obs:obsFila });
      }
    }

    state.equipos=equipos; state.registros=registros;
    state.meta={ archivo:file.name, fechaCarga:new Date().toISOString(),
      hojaPMP:"PMP_2026", hojaReg:"Registro_MP-2026",
      avisos, oficializados:0, ignoradosDetalle:ignorados };

    const promovidos = promoverBorradores();
    state.meta.oficializados = promovidos;
    await persistDatos(); await persistUsuario();
    toast(`Planilla cargada: ${equipos.length} equipos, ${registros.length} registros.` + (promovidos?` ${promovidos} borradores → Oficial.`:"") );
    if(ignorados.length) console.info(`MP2026: ${ignorados.length} celdas con datos sucios ignoradas.`, ignorados.slice(0,20));
    ui.view="tablero"; render();
  }catch(e){ console.error(e); toast("Error leyendo el .xlsm: "+e.message); }
}

/* =========================================================================
   IMPORTAR RESPALDO DE LA APP ANTERIOR (§5b)

const OLD_PEND_MAP = {
  "Reprogramación Mantención Preventiva": { origen:"preventiva", tipo:"reprogramacion" },
  "Protocolo Interno de Mantenimiento":   { origen:"preventiva", tipo:"protocolo_interno" },
  "Protocolo Externo de Mantenimiento":   { origen:"preventiva", tipo:"protocolo_externo" },
  "Otro":                                 { origen:"administrativo", tipo:"otro" }
};
async function importOldBackup(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.tipo!=="respaldo-gmp2026"){ toast("No parece un respaldo de la app anterior (tipo ≠ respaldo-gmp2026)."); return; }
    let nMP=0,nPend=0,nCorr=0;
    // manuales → detalleMP
    for(const m of (data.manuales||[])){
      state.detalleMP.push({
        id: m.id||uid(), creado: (m.creado||todayISO()).slice(0,10), equipoKey: m.equipoKey,
        fecha: (m.fecha||"").slice(0,10), programacion: normProg(m.programacion)||m.programacion||"",
        ejecutor: m.ejecutor||"", resultado: normResult(m.resultado)||m.resultado||"",
        observaciones: m.observaciones||"", estadoEquipo: m.estadoEquipo||"Operativo",
        gestionPendiente: !!m.gestionPendiente, tipoMantenimiento: m.tipoMantenimiento||"",
        ingenieroExterno: m.ingenieroExterno||"", empresaExterna: m.empresaExterna||"",
        tipoRegistro: m.tipoRegistro==="Oficial"?"Oficial":"Borrador",
        oficializado: m.oficializado||null, actualizado: (m.actualizado||m.creado||todayISO()).slice(0,10)
      }); nMP++;
    }
    // pendientes → modelo de 5 tipos
    for(const p of (data.pendientes||[])){
      const map = OLD_PEND_MAP[p.tipo] || { origen:"administrativo", tipo:"otro" };
      state.pendientes.push({
        id: p.id||uid(), creado:(p.creado||todayISO()).slice(0,10), origenMP:p.origenMP||null,
        equipoKey: p.equipoKey, origen: map.origen, tipo: map.tipo, causal: p.causal||"",
        fechaReporte: (p.fechaReporte||"").slice(0,10), fechaCompromiso: (p.fechaCompromiso||"").slice(0,10),
        prioridad: p.prioridad||"Media", situacion: p.situacion||"",
        respEjecutivo: p.respEjec||p.respEjecutivo||"", respAdministrativo: p.respAdmin||p.respAdministrativo||RESP_ADMIN_DEFAULT,
        enEsperaDe: p.enEsperaDe||"", descripcion: p.descripcion||"",
        tareas: normalizeTareas(p.tareas||[]),
        seguimiento: normalizeSeguimiento(p.gestiones||p.seguimiento||[]),
        folioSIGEM: p.folioSIGEM||"", empresa: p.empresa||"", origenDoc: p.origenDoc||"",
        fuente: p.fuente||"app",
        estado: p.estado||"Abierto", fechaCompletado:(p.fechaCompletado||"").slice(0,10)
      }); nPend++;
    }
    // correctivos
    for(const c of (data.correctivos||[])){
      state.correctivos.push(Object.assign({}, c, {
        id:c.id||uid(), creado:(c.creado||todayISO()).slice(0,10),
        otCompleta: c.tipoEvento==="Orden de Trabajo" ? true : (c.otCompleta!==false),
        avances:(c.avances||[]).map(a=>Object.assign({id:a.id||uid()},a)),
        tipoRegistro: c.tipoRegistro==="Oficial"?"Oficial":"Borrador",
        estadoEvento: c.estadoEvento||"Abierto"
      })); nCorr++;
    }
    // catálogos
    for(const e of (data.empresas||[])) if(e && !state.empresas.includes(e)) state.empresas.push(e);
    for(const g of (data.ingenieros||[])) if(g && !state.ingenieros.includes(g)) state.ingenieros.push(g);

    promoverBorradores();
    const dropRep=dedupReprogramaciones();
    await persistUsuario();
    dirtySinceBackup=true;
    toast(`Importado: ${nMP} mantenciones, ${nPend} pendientes, ${nCorr} correctivos.`+(dropRep?` ${dropRep} reprog. duplicada(s) descartada(s).`:""));
    if(!state.equipos.length) toast("Recuerda cargar el .xlsm oficial para revincular equipos.");
    render();
  }catch(e){ console.error(e); toast("Error importando respaldo: "+e.message); }
}
function normalizeTareas(arr){
  return (arr||[]).map(t=>({
    texto: t.texto||"", hecha: !!t.hecha,
    opciones: t.opciones||null, estado: t.estado||null,
    subtareas: (t.subtareas||[]).map(s=>({texto:s.texto||"",hecha:!!s.hecha}))
  }));
}
function normalizeSeguimiento(arr){
  return (arr||[]).map(g=>{
    if(typeof g==="string") return { fecha:todayISO(), texto:g, autor:"" };
    return { fecha:(g.fecha||g.cuando||todayISO()).slice(0,10), texto:g.texto||g.detalle||g.comentario||"", autor:g.autor||"" };
  });
}

   Lee los expedientes correctivos (OT + sub-registros) y el módulo de
   pendientes con taxonomía propia. Correctivos: fusión por folio.
   Pendientes: se añaden marcados con fuente "integrado".
   ========================================================================= */
const INTEG_PEND_MAP = {
  "Reprogramación MP":          { origen:"preventiva",     tipo:"reprogramacion" },
  "Documento faltante":         { origen:"correctivo",     tipo:"documental" },
  "Firma faltante":             { origen:"preventiva",     tipo:"reprogramacion" },
  "Pauta de Monitoreo Diario":  { origen:"administrativo", tipo:"otro" },
  "Gestión general":            { origen:"administrativo", tipo:"otro" },
  "Seguimiento de estado":      { origen:"administrativo", tipo:"otro" }
};
function parseAnyDate(v){
  if(v==null) return "";
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  let s=String(v).trim(); if(!s) return "";
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if(/^\d+(\.\d+)?$/.test(s)){ const n=parseFloat(s); if(n>30000&&n<60000){ return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10); } }
  const d=new Date(s); return isNaN(d)?"":d.toISOString().slice(0,10);
}
// Devuelve {idx:{header→col}, rows:[...]} de una hoja, identificando columnas por encabezado.
function sheetTable(wb, name){
  const ws=wb.Sheets[name]; if(!ws) return null;
  const arr=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  let h=-1; for(let i=0;i<arr.length;i++){ if(arr[i] && arr[i].some(c=>String(c).trim()!=="")){ h=i; break; } }
  if(h<0) return { idx:{}, rows:[] };
  const idx={}; arr[h].forEach((c,i)=>{ const k=String(c).trim(); if(k) idx[k]=i; });
  return { idx, rows: arr.slice(h+1).filter(r=>r && r.some(c=>String(c).trim()!=="")) };
}
async function importIntegrado(file){
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const get=(row,idx,name)=> idx[name]!=null ? String(row[idx[name]]??"").trim() : "";
    let nCorrNuevo=0, nCorrEnriq=0, nAvances=0, nPend=0;

    // índice de correctivos por folio (incluye los ya importados del JSON)
    const corrByFolio={}; for(const c of state.correctivos){ if(c.folioSigem) corrByFolio[c.folioSigem]=c; }
    function ensureCorr(folio, eqKey){
      if(corrByFolio[folio]) return corrByFolio[folio];
      const c={ id:uid(), creado:todayISO(), equipoKey:eqKey||"", folioSigem:folio, otCompleta:false,
        tipoEvento:"Orden de Trabajo", requerimiento:"", fechaDocumento:"", tecnico:"", estadoEquipo:"No Operativo",
        estadoEvento:"Abierto", tipoRegistro:"Borrador", fuente:"integrado", avances:[] };
      state.correctivos.push(c); corrByFolio[folio]=c; nCorrNuevo++; return c;
    }
    function addAvance(c, av){
      if(!av.fecha && !av.detalle && !av.numero) return;
      const dup=(c.avances||[]).some(a=>a.tipo===av.tipo && (a.fecha||"")===(av.fecha||"") && (a.numero||"")===(av.numero||""));
      if(dup) return;
      c.avances.push(Object.assign({id:uid(),registrado:new Date().toISOString()},av)); nAvances++;
    }

    // 1. Órdenes de Trabajo (apertura)
    const ot=sheetTable(wb,"1. Órdenes de Trabajo");
    if(ot) for(const r of ot.rows){
      const folio=get(r,ot.idx,"Folio SIGEM"); if(!folio) continue;
      const inv=get(r,ot.idx,"N° Inventario"), serie=get(r,ot.idx,"N° Serie (auto)");
      const eqKey=equipoKeyFrom(serie,inv);
      const existed=!!corrByFolio[folio];
      const c=ensureCorr(folio,eqKey);
      // enriquecer apertura (la planilla integrada es más completa)
      if(!c.equipoKey) c.equipoKey=eqKey;
      if(!c.fechaDocumento) c.fechaDocumento=parseAnyDate(get(r,ot.idx,"Fecha OT"));
      if(!c.tecnico) c.tecnico=get(r,ot.idx,"Técnico asignado");
      if(!c.requerimiento) c.requerimiento=get(r,ot.idx,"Requerimiento");
      const estIni=get(r,ot.idx,"Estado inicial"); if(estIni) c.estadoEquipo=estIni;
      c.otCompleta=true;
      const estEvento=get(r,ot.idx,"Estado del evento");
      if(/cerrad/i.test(estEvento)){ c.estadoEvento="Cerrado"; const fc=parseAnyDate(get(r,ot.idx,"Fecha cierre OT")); if(fc)c.fechaCierre=fc; }
      if(existed) nCorrEnriq++;
    }
    // 5. Servicio Técnico (Envíos)
    const env=sheetTable(wb,"5. Servicio Técnico (Envíos)");
    if(env) for(const r of env.rows){
      const folio=get(r,env.idx,"Folio SIGEM"); if(!folio) continue; const c=ensureCorr(folio);
      addAvance(c,{ tipo:"Envío a servicio técnico", fecha:parseAnyDate(get(r,env.idx,"Fecha envío")),
        numero:get(r,env.idx,"N° Hoja de Envío"), empresa:get(r,env.idx,"Empresa destino"), responsable:get(r,env.idx,"Responsable que envía"),
        detalle:[`Reporte ${get(r,env.idx,"N° Reporte Servicio")}`.trim(), get(r,env.idx,"¿Reporte recibido?")].filter(s=>s&&s!=="Reporte").join(" · ") });
      const fret=parseAnyDate(get(r,env.idx,"Fecha retorno"));
      if(fret) addAvance(c,{ tipo:"Retorno de servicio técnico", fecha:fret, detalle:[`Estado: ${get(r,env.idx,"Estado al retorno")}`, get(r,env.idx,"Folio guía despacho")?`Guía ${get(r,env.idx,"Folio guía despacho")}`:""].filter(Boolean).join(" · "), estadoEquipoVisita:get(r,env.idx,"Estado al retorno") });
    }
    // 4. Visitas Técnicas
    const vis=sheetTable(wb,"4. Visitas Técnicas");
    if(vis) for(const r of vis.rows){
      const folio=get(r,vis.idx,"Folio SIGEM"); if(!folio) continue; const c=ensureCorr(folio);
      addAvance(c,{ tipo:"Visita técnica externa", fecha:parseAnyDate(get(r,vis.idx,"Fecha visita")),
        empresa:get(r,vis.idx,"Proveedor / empresa"), responsable:get(r,vis.idx,"Ingeniero externo"), numero:get(r,vis.idx,"N° Reporte Servicio"),
        detalle:[`¿Reparó? ${get(r,vis.idx,"¿Reparó?")}`.trim(), get(r,vis.idx,"Descripción tarea")].filter(s=>s&&s!=="¿Reparó?").join(" — "),
        estadoEquipoVisita:get(r,vis.idx,"Estado final") });
    }
    // 2. Línea de Compra
    const lc=sheetTable(wb,"2. Línea de Compra");
    if(lc) for(const r of lc.rows){
      const folio=get(r,lc.idx,"Folio SIGEM"); if(!folio) continue; const c=ensureCorr(folio);
      const nCot=get(r,lc.idx,"N° cotización"), fCot=parseAnyDate(get(r,lc.idx,"Fecha cotización")), prov=get(r,lc.idx,"Proveedor cotizado");
      if(nCot||fCot||prov) addAvance(c,{ tipo:"Cotización", fecha:fCot, numero:nCot, empresa:prov, detalle:[get(r,lc.idx,"Tipo de compra"), get(r,lc.idx,"Monto cotizado")?`Monto ${get(r,lc.idx,"Monto cotizado")}`:""].filter(Boolean).join(" · ") });
      const nIT=get(r,lc.idx,"N° Informe Técnico");
      if(nIT) addAvance(c,{ tipo:"Informe técnico emitido", fecha:parseAnyDate(get(r,lc.idx,"Fecha informe")), numero:nIT, responsable:get(r,lc.idx,"Responsable informe") });
      const nOC=get(r,lc.idx,"N° OC");
      if(nOC) addAvance(c,{ tipo:"OC emitida", fecha:parseAnyDate(get(r,lc.idx,"Fecha emisión OC")), numero:nOC, detalle:get(r,lc.idx,"Descripción OC") });
    }
    // 7. Reparación en Terreno
    const rt=sheetTable(wb,"7. Reparación en Terreno");
    if(rt) for(const r of rt.rows){
      const folio=get(r,rt.idx,"Folio SIGEM"); if(!folio) continue; const c=ensureCorr(folio);
      addAvance(c,{ tipo:"Reparación en terreno", fecha:parseAnyDate(get(r,rt.idx,"Fecha reparación / cierre")), detalle:get(r,rt.idx,"Descripción tarea"), estadoEquipoVisita:get(r,rt.idx,"Estado final equipo") });
    }
    // 6. Bajas
    const bj=sheetTable(wb,"6. Bajas");
    if(bj) for(const r of bj.rows){
      const folio=get(r,bj.idx,"Folio SIGEM"); if(!folio) continue; const c=ensureCorr(folio);
      addAvance(c,{ tipo:"Baja", fecha:parseAnyDate(get(r,bj.idx,"Fecha baja")), numero:get(r,bj.idx,"Folio documento de baja"), responsable:get(r,bj.idx,"Responsable interno"), detalle:get(r,bj.idx,"Motivo") });
      c.estadoEquipo="Baja";
    }

    // Pendientes (taxonomía propia) → se añaden marcados fuente:"integrado"
    const pe=sheetTable(wb,"Pendientes");
    if(pe) for(const r of pe.rows){
      const tipoOrig=get(r,pe.idx,"Tipo de pendiente"); const inv=get(r,pe.idx,"N° Inventario"), serie=get(r,pe.idx,"Serie");
      if(!tipoOrig && !inv && !serie) continue;
      const map=INTEG_PEND_MAP[tipoOrig] || { origen:"administrativo", tipo:"otro" };
      const estadoSheet=get(r,pe.idx,"Estado");
      const estado=/hecho|resuelto|complet/i.test(estadoSheet)?"Completado":"Abierto";
      const tareasTxt=get(r,pe.idx,"Tareas");
      const tareas=tareasTxt? tareasTxt.split(/\r?\n|\s\|\s/).map(t=>t.trim()).filter(Boolean).map(t=>({texto:t,hecha:estado==="Completado"})):[];
      state.pendientes.push({
        id:uid(), creado:parseAnyDate(get(r,pe.idx,"Creado"))||todayISO(), origenMP:null,
        equipoKey:equipoKeyFrom(serie,inv), origen:map.origen, tipo:map.tipo, tipoOriginal:tipoOrig, causal:"",
        fechaReporte:"", fechaCompromiso:parseAnyDate(get(r,pe.idx,"Fecha compromiso")),
        prioridad:get(r,pe.idx,"Prioridad")||"Media", situacion:[get(r,pe.idx,"Situación"), estadoSheet].filter(Boolean).join(" · "),
        respEjecutivo:get(r,pe.idx,"Responsable Ejecutivo"), respAdministrativo:get(r,pe.idx,"Responsable Administrativo")||RESP_ADMIN_DEFAULT,
        enEsperaDe:get(r,pe.idx,"En espera de"),
        descripcion:[tipoOrig?`[${tipoOrig}]`:"", get(r,pe.idx,"Descripción")].filter(Boolean).join(" "),
        tareas, seguimiento:[], folioSIGEM:"", empresa:"", origenDoc:"",
        fuente:"integrado", estado, fechaCompletado:parseAnyDate(get(r,pe.idx,"Fecha completado"))
      }); nPend++;
    }

    const dropRep=dedupReprogramaciones();
    await markDirty("usuario"); dirtySinceBackup=true;
    toast(`Integrado: ${nCorrNuevo} correctivos nuevos, ${nCorrEnriq} enriquecidos (+${nAvances} avances), ${nPend} pendientes.`+(dropRep?` ${dropRep} reprog. dup. descartada(s).`:""));
    if(!state.equipos.length) toast("Carga el .xlsm oficial para revincular equipos.");
    render();
  }catch(e){ console.error(e); toast("Error importando planilla integrada: "+e.message); }
}

/* =========================================================================
   IMPORTAR CONSOLIDADOS (.xlsx) — "Consolidado de mantenciones / pendientes"
   Detecta el tipo por los encabezados y registra cada fila como detalleMP o
   pendiente, enlazando por N° Serie / N° Inventario.
   ========================================================================= */
function normEstadoEquipo(v){
  if(!v) return ""; const s=String(v).trim().toLowerCase();
  if(s.includes("no oper")) return "No Operativo";
  if(s.startsWith("oper")) return "Operativo";
  if(s.includes("servicio")) return "Servicio Técnico";
  if(s.includes("préstamo")||s.includes("prestamo")) return "Préstamo";
  if(s.includes("ubicab")) return "No Ubicable";
  if(s==="baja") return "Baja";
  return "";
}
const CONS_PEND_MAP = Object.assign({}, OLD_PEND_MAP, INTEG_PEND_MAP);
function parseTareasTexto(txt){
  if(!txt) return [];
  return String(txt).split(/\r?\n|\s*;\s*|\s\|\s/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.match(/^\[\s*([xX✓]?)\s*\]\s*(.*)$/);
    if(m) return { texto:m[2].trim(), hecha: m[1].trim()!=="" };
    return { texto:s, hecha:false };
  });
}
async function importConsolidado(file){
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const keys=new Set(state.equipos.map(e=>e.key));
    let nMP=0, nPend=0, unlinkedMP=0, unlinkedPend=0, badRes=0;
    for(const sheetName of wb.SheetNames){
      const tbl=sheetTable(wb, sheetName); if(!tbl || !tbl.rows.length) continue;
      const idx=tbl.idx, get=(r,name)=> idx[name]!=null?String(r[idx[name]]??"").trim():"";
      if(idx["Fecha de ejecución"]!=null && idx["Resultado"]!=null){
        // ---- Mantenciones ----
        for(const r of tbl.rows){
          const inv=get(r,"N° Inventario"), serie=get(r,"Serie");
          if(!inv && !serie) continue;
          const k=equipoKeyFrom(serie,inv); if(!keys.has(k)) unlinkedMP++;
          const resultado=normResult(get(r,"Resultado")); if(get(r,"Resultado") && !resultado) badRes++;
          const empresa=get(r,"Empresa (si externo)");
          const fecha=parseAnyDate(get(r,"Fecha de ejecución"));
          const eq=equipoByKey(k); const mes=mesDeFecha(fecha);
          state.detalleMP.push({
            id:uid(), creado:todayISO(), equipoKey:k, fecha,
            programacion: (eq&&mes!=null&&eq.prog[mes])?eq.prog[mes]:"X",
            ejecutor:get(r,"Ejecutor"), resultado, observaciones:[get(r,"Observaciones"),get(r,"Significado / Detalle")].filter(Boolean).join(" · "),
            estadoEquipo: normEstadoEquipo(get(r,"Estado del equipo"))|| (resultado?estadoDeResultado(resultado)||"Operativo":"Operativo"),
            gestionPendiente:false, tipoMantenimiento: empresa?"Externo":"Interno",
            ingenieroExterno:"", empresaExterna:empresa,
            tipoRegistro:"Borrador", fuente:"consolidado"
          });
          if(empresa && !state.empresas.includes(empresa)) state.empresas.push(empresa);
          nMP++;
        }
      } else if(idx["Tipo de pendiente"]!=null){
        // ---- Pendientes ----
        for(const r of tbl.rows){
          const inv=get(r,"N° Inventario"), serie=get(r,"Serie"); const tipoOrig=get(r,"Tipo de pendiente");
          if(!inv && !serie && !tipoOrig) continue;
          const k=equipoKeyFrom(serie,inv); if(!keys.has(k)) unlinkedPend++;
          const map=CONS_PEND_MAP[tipoOrig] || { origen:"administrativo", tipo:"otro" };
          const estado=/complet|hecho|resuelto/i.test(get(r,"Estado"))?"Completado":"Abierto";
          state.pendientes.push({
            id:uid(), creado:todayISO(), origenMP:null, equipoKey:k, origen:map.origen, tipo:map.tipo, tipoOriginal:tipoOrig, causal:"",
            fechaReporte:"", fechaCompromiso:parseAnyDate(get(r,"Fecha compromiso")), prioridad:"Media", situacion:"",
            respEjecutivo:get(r,"Responsable Ejecutivo"), respAdministrativo:get(r,"Responsable Administrativo")||RESP_ADMIN_DEFAULT,
            enEsperaDe:"", descripcion:[tipoOrig?`[${tipoOrig}]`:"",get(r,"Descripción")].filter(Boolean).join(" "),
            tareas:parseTareasTexto(get(r,"Tareas")), seguimiento:[], folioSIGEM:"", empresa:"", origenDoc:"",
            fuente:"consolidado", estado, fechaCompletado: estado==="Completado"?todayISO():""
          });
          nPend++;
        }
      }
    }
    const promovidos=promoverBorradores();
    const dropRep=dedupReprogramaciones();
    await markDirty("usuario"); dirtySinceBackup=true;
    const partes=[]; if(nMP)partes.push(`${nMP} mantenciones`); if(nPend)partes.push(`${nPend} pendientes`);
    toast(`Consolidado importado: ${partes.join(" · ")||"nada reconocido"}.`+(promovidos?` ${promovidos}→Oficial.`:"")+(dropRep?` ${dropRep} reprog. dup. descartada(s).`:""));
    if(unlinkedMP||unlinkedPend) console.info(`Consolidado: ${unlinkedMP} MP y ${unlinkedPend} pendientes sin equipo en la planilla (se conservan).`);
    if(!state.equipos.length) toast("Carga el .xlsm oficial para enlazar equipos.");
    render();
    return { nMP, nPend, unlinkedMP, unlinkedPend, badRes, promovidos };
  }catch(e){ console.error(e); toast("Error importando consolidado: "+e.message); }
}

/* =========================================================================
   LÓGICA DE NEGOCIO / DECISIÓN
   ========================================================================= */
const equipoByKey = (k)=> idx().eq.get(k);
const regsByEquipo = (k)=> idx().r.get(k)||[];
const mpByEquipo = (k)=> idx().m.get(k)||[];
const pendByEquipo = (k)=> idx().p.get(k)||[];
const corrByEquipo = (k)=> idx().c.get(k)||[];
// Índices por equipoKey (rendimiento): se reconstruyen al renderizar o tras mutar datos.
let _idx=null;
function invalidarIndices(){ _idx=null; }
function idx(){
  if(_idx) return _idx;
  const eq=new Map(), r=new Map(), m=new Map(), p=new Map(), c=new Map();
  const push=(map,k,v)=>{ let a=map.get(k); if(!a){ a=[]; map.set(k,a); } a.push(v); };
  for(const e of state.equipos) eq.set(e.key,e);
  for(const x of state.registros) push(r,x.equipoKey,x);
  for(const x of state.detalleMP) push(m,x.equipoKey,x);
  for(const x of state.pendientes) push(p,x.equipoKey,x);
  for(const x of state.correctivos) push(c,x.equipoKey,x);
  _idx={eq,r,m,p,c}; return _idx;
}

// B.4 — resultado que cuenta por equipo+mes
function resultadoMes(key, mes){
  const regs=idx().r.get(key);
  if(regs){ const reg=regs.find(r=>r.mes===mes && r.resultado); if(reg) return { resultado:reg.resultado, origen:"planilla", programa:reg.programa }; }
  const mlist=idx().m.get(key);
  if(mlist){ const mps=mlist.filter(m=>m.resultado && mesDeFecha(m.fecha)===mes).sort((a,b)=> (a.fecha<b.fecha?1:-1));
    if(mps.length) return { resultado:mps[0].resultado, origen:"app", mp:mps[0] }; }
  return { resultado:"", origen:"none" };
}
function mesDeFecha(iso){ if(!iso) return null; const m=parseInt(String(iso).slice(5,7),10); return isNaN(m)?null:m-1; }

// B.3 — promoción Borrador→Oficial al recargar planilla
function promoverBorradores(){
  let n=0;
  for(const m of state.detalleMP){
    if(m.tipoRegistro!=="Borrador") continue;
    const mes = mesDeFecha(m.fecha); if(mes==null) continue;
    const reg = state.registros.find(r=>r.equipoKey===m.equipoKey && r.mes===mes && r.resultado);
    if(reg){ m.tipoRegistro="Oficial"; m.oficializado=todayISO(); n++; }
  }
  return n;
}

// Descarta reprogramaciones duplicadas: una sola por equipo (prefiere conservar la Abierta, luego la más antigua).
function dedupReprogramaciones(){
  const byEq={};
  state.pendientes.forEach(p=>{ if(p.tipo==="reprogramacion"){ (byEq[p.equipoKey]=byEq[p.equipoKey]||[]).push(p); } });
  const removeIds=new Set();
  Object.values(byEq).forEach(grp=>{
    if(grp.length<2) return;
    grp.sort((a,b)=> (a.estado==="Completado"?1:0)-(b.estado==="Completado"?1:0) || String(a.creado||"").localeCompare(String(b.creado||"")));
    grp.slice(1).forEach(p=>removeIds.add(p.id));
  });
  if(removeIds.size) state.pendientes=state.pendientes.filter(p=>!removeIds.has(p.id));
  return removeIds.size;
}

// ===== Estado del equipo gestionado por la app (fuente de verdad + trazabilidad) =====
function eventosEstadoDe(key){ return state.eventosEstado.filter(ev=>ev.equipoKey===key); }
function ultimoEventoEstado(key){
  let last=null;
  for(const ev of state.eventosEstado){ if(ev.equipoKey===key && ev.estado){ if(!last || String(ev.fecha)>String(last.fecha)) last=ev; } }
  return last;
}
// Registra un cambio de estado (queda en la bitácora con fecha/hora, motivo y responsable).
async function registrarEstado(key, estado, motivo, nota, por){
  const ev={ id:uid(), equipoKey:key, fecha:new Date().toISOString(), estado, motivo:motivo||"", nota:nota||"", por:por||prefs.ultimoEjecutor||"" };
  state.eventosEstado.push(ev);
  if(por) prefs.ultimoEjecutor=por;
  await markDirty("usuario");
  return ev;
}
// Marca de «última actualización»: lo más reciente registrado sobre el equipo.
function ultActividad(key){
  let t="";
  const up=v=>{ if(v && String(v)>t) t=String(v); };
  for(const m of mpByEquipo(key)){ up(m.fecha); up(m.creado); }
  for(const p of pendByEquipo(key)){ up(p.creado); up(p.fechaReporte); up(p.fechaCompletado); (p.seguimiento||[]).forEach(s=>up(s.fecha)); }
  for(const c of corrByEquipo(key)){ up(c.fechaDocumento); up(c.fechaCierre); (c.avances||[]).forEach(a=>up(a.fecha||a.registrado)); }
  for(const ev of eventosEstadoDe(key)) up(ev.fecha);
  return t;
}
function fmtDateTime(iso){ if(!iso) return "—"; const s=String(iso);
  if(s.includes("T")){ const d=new Date(s); if(!isNaN(d)) return `${fmtDate(s)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  return fmtDate(s); }

// ===== «Sin seguimiento»: detectar lo que quedó sin atención =====
// Estados que requieren seguimiento (no operativos y no dados de baja).
const ESTADOS_ATENCION = ["No Operativo","Servicio Técnico","No Ubicable","Préstamo"];
function diasDesde(iso){ if(!iso) return null; const s=String(iso); const d=new Date(s.length<=10? s+"T00:00:00" : s); if(isNaN(d)) return null; return Math.floor((Date.now()-d.getTime())/86400000); }
function diasSinActividad(key){ return diasDesde(ultActividad(key)); }
function diasSinSegPref(){ return prefs.diasSinSeg||7; }
// Equipos detenidos (estado de atención) sin actividad registrada hace ≥ dias (o nunca).
function equiposSinSeguimiento(dias){
  dias = dias||diasSinSegPref();
  return state.equipos
    .filter(e=> ESTADOS_ATENCION.includes(estadoEquipo(e.key)))
    .map(e=>({ e, dias:diasSinActividad(e.key) }))
    .filter(x=> x.dias==null || x.dias>=dias)
    .sort((a,b)=> (b.dias==null?1e9:b.dias)-(a.dias==null?1e9:a.dias));
}
// Pendientes abiertos sin seguimiento (último seguimiento / reporte) hace ≥ dias.
function pendSinSeguimiento(dias){
  dias = dias||diasSinSegPref();
  return state.pendientes.filter(p=>{
    if(p.estado==="Completado") return false;
    const segs=p.seguimiento||[];
    const last = (segs.length? segs[segs.length-1].fecha : null) || p.fechaReporte || p.creado;
    const d=diasDesde(last);
    return d==null || d>=dias;
  });
}

function estadoEquipo(key){
  // 1) Fuente de verdad: el estado fijado en la app (el evento más reciente manda).
  const evManual=ultimoEventoEstado(key);
  if(evManual) return evManual.estado;
  // 2) Semilla: sin estado en la app, se DERIVA del .xlsm (snapshot) + correctivos.
  // Baja tiene prioridad máxima
  for(let m=11;m>=0;m--){ const r=resultadoMes(key,m); if(r.resultado==="Baja") return "Baja"; }
  // correctivo abierto → No Operativo / Servicio Técnico
  const corrAbierto = state.correctivos.some(c=>c.equipoKey===key && c.estadoEvento!=="Cerrado");
  // último resultado con estado implícito (recorrido de meses desc)
  let estado=null, ultFecha="";
  for(let m=11;m>=0;m--){
    const r=resultadoMes(key,m);
    if(!r.resultado) continue;
    const e=estadoDeResultado(r.resultado, r.mp);
    if(e){ estado=e; break; }
  }
  // mantenciones de la app posteriores pueden fijar estado explícito
  const mps=mpByEquipo(key).filter(m=>m.estadoEquipo).sort((a,b)=>a.fecha<b.fecha?1:-1);
  if(mps.length && mps[0].estadoEquipo && !["Baja"].includes(estado)){
    // si el resultado más reciente lo dejó operativo, respeta lo que marcó el técnico
    if(estado===null || estado==="Operativo") estado=mps[0].estadoEquipo;
  }
  if(corrAbierto && (!estado || estado==="Operativo")) estado="No Operativo";
  return estado || "Operativo";
}
function estadoDeResultado(res, mp){
  switch(res){
    case "C2": return "Servicio Técnico";
    case "C3": return "No Operativo";
    case "C4": return "Préstamo";
    case "FS": return "No Operativo";
    case "NU": return "No Ubicable";
    case "Baja": return "Baja";
    case "Si": case "Si-RA": return mp && mp.estadoEquipo ? mp.estadoEquipo : "Operativo";
    default: return null; // C1/C5/C6/C7/C8 (reprog) / No → no cambian estado
  }
}

// B.11 — cumplimiento
function cumplimiento(){
  const hoyMes = new Date().getMonth();
  let progT=0, realT=0; const porMes=[];
  for(let m=0;m<12;m++){
    let prog=0, real=0;
    for(const e of state.equipos){
      if(!e.prog[m]) continue; // no programado
      prog++;
      const r=resultadoMes(e.key,m);
      if(r.resultado==="Si"||r.resultado==="Si-RA") real++;
    }
    const futuro = m>hoyMes;
    porMes.push({ mes:m, prog, real, pct: (!prog||futuro)?null:Math.round(100*real/prog), futuro });
    if(!futuro){ progT+=prog; realT+=real; }
  }
  return { porMes, total: progT?Math.round(100*realT/progT):null, progT, realT };
}

// Resumen mes × código (conteo de equipos)
function resumenMesCodigo(){
  // columnas: X, R, RA, sin registro, Sí, y causales agregadas
  const cols = ["X","R","RA","PM","sin","Si","Si-RA","C1-8","FS","No","NU","Baja"];
  const matrix=[];
  for(let m=0;m<12;m++){
    const row={ mes:m, counts:{} }; cols.forEach(c=>row.counts[c]=0);
    for(const e of state.equipos){
      const prog=e.prog[m];
      const r=resultadoMes(e.key,m);
      if(prog && PROG_CODES[prog]) row.counts[prog]++;
      if(prog && !r.resultado) row.counts["sin"]++;
      const res=r.resultado;
      if(res==="Si") row.counts["Si"]++;
      else if(res==="Si-RA") row.counts["Si-RA"]++;
      else if(/^C[1-8]$/.test(res)) row.counts["C1-8"]++;
      else if(res==="FS") row.counts["FS"]++;
      else if(res==="No") row.counts["No"]++;
      else if(res==="NU") row.counts["NU"]++;
      else if(res==="Baja") row.counts["Baja"]++;
    }
    matrix.push(row);
  }
  return { cols, matrix };
}

// Etapa del reporte de reprogramación (B.7) según tareas hechas
function etapaReprog(p){
  const done = (label)=> (p.tareas||[]).some(t=> (t.texto||"").toLowerCase().includes(label) && (t.hecha|| t.estado==="Sí"));
  const generado=done("generar")||done("genera");
  const impreso=done("imprimir")||done("imprim");
  const fSup=done("supervisor");
  const fJefe=done("jefe");
  if(!generado) return { label:"Por generar", cls:"b-bad" };
  if(!impreso) return { label:"Por imprimir", cls:"b-warn" };
  if(!fSup && !fJefe) return { label:"Faltan 2 firmas", cls:"b-warn" };
  if(fSup && !fJefe) return { label:"Falta firma del jefe", cls:"b-warn" };
  if(!fSup && fJefe) return { label:"Falta firma del supervisor", cls:"b-warn" };
  // ambas firmas
  const enMaestro = p.causal && p.fechaCompromiso ? hayResultadoPlanillaProx(p) : false;
  return { label: enMaestro?"Oficializado":"Firmado · por volcar", cls: enMaestro?"b-ok":"b-info", firmado:true, enMaestro };
}
function hayResultadoPlanillaProx(p){
  const e=equipoByKey(p.equipoKey); if(!e) return false;
  // si la planilla ya tiene resultado de reprogramación en algún mes futuro próximo
  return state.registros.some(r=>r.equipoKey===p.equipoKey && (r.programa==="R") && r.resultado);
}
function reprogFirmada(p){ const et=etapaReprog(p); return !!et.firmado; }

// días de atraso del pendiente
function diasAtraso(p){
  if(p.estado==="Completado") return null;
  const d=daysFromToday(p.fechaCompromiso);
  return d!=null && d>0 ? d : null;
}
function pendienteVencido(p){ return p.estado!=="Completado" && diasAtraso(p)!=null; }

// B.12 — Tablero de operatividad
function equiposOperatividad(){
  const out=[];
  for(const e of state.equipos){
    const est=estadoEquipo(e.key);
    const corrAbierto = state.correctivos.some(c=>c.equipoKey===e.key && c.estadoEvento!=="Cerrado");
    const pend = pendByEquipo(e.key).filter(p=>p.estado!=="Completado");
    const vencidos = pend.filter(pendienteVencido);
    const protocolos = pend.filter(p=>p.tipo==="protocolo_interno"||p.tipo==="protocolo_externo");
    const inFS_NU = est==="No Operativo"||est==="No Ubicable";
    if(est!=="Operativo" || corrAbierto || inFS_NU || vencidos.length || protocolos.length){
      // criticidad por días detenido
      let dias=0;
      const corr=corrByEquipo(e.key).filter(c=>c.estadoEvento!=="Cerrado").sort((a,b)=> (a.fechaDocumento<b.fechaDocumento?1:-1));
      if(corr.length && corr[0].fechaDocumento) dias=daysFromToday(corr[0].fechaDocumento)||0;
      out.push({ equipo:e, estado:est, corrAbierto, pend:pend.length, vencidos:vencidos.length, dias,
        critico: est==="Baja"?3:(dias>30||vencidos.length?2:1) });
    }
  }
  return out.sort((a,b)=> b.critico-a.critico || b.dias-a.dias);
}

// MP del mes sin resultado / vencidas
function mpSinResultado(){
  const hoyMes=new Date().getMonth(); const out=[];
  for(const e of state.equipos){
    for(let m=0;m<=hoyMes;m++){
      if(!e.prog[m]) continue;
      const r=resultadoMes(e.key,m);
      if(!r.resultado){ out.push({equipo:e, mes:m, vencida: m<hoyMes }); }
    }
  }
  return out;
}

// Borradores listos para volcar al .xlsm (§7 panel)
function porVolcar(){
  const out=[];
  // mantenciones en borrador con resultado directo
  for(const m of state.detalleMP){
    if(m.tipoRegistro!=="Borrador" || !m.resultado) continue;
    const mes=mesDeFecha(m.fecha); if(mes==null) continue;
    const e=equipoByKey(m.equipoKey); if(!e) continue;
    const esReprog=/^C[1-8]$/.test(m.resultado);
    let listo=true;
    if(esReprog){
      // solo si su reporte de reprogramación tiene las 2 firmas
      const p=state.pendientes.find(pp=>pp.equipoKey===m.equipoKey && pp.tipo==="reprogramacion" && pp.estado!=="Completado");
      listo = p ? reprogFirmada(p) : false;
    }
    if(!listo) continue;
    out.push({
      tipo:"MP", equipo:e, mes, codigo:m.resultado,
      hoja:"Registro_MP-2026", fila:e.fila, columna:REG_R_COL_LETTER[mes], ref:m
    });
  }
  return out.sort((a,b)=> (a.equipo.servicio||"").localeCompare(b.equipo.servicio||"") || a.mes-b.mes);
}

const EQ_DEFAULT_COLS = ["inventario","equipo","serie","servicio","ubicacion","_estado","_pend","_ultact"];

function visibleEqColumns(){
  if(prefs.columnasEquipos && prefs.columnasEquipos.length) return EQ_COLUMNS.filter(c=>prefs.columnasEquipos.includes(c.f));
  return EQ_COLUMNS.filter(c=>EQ_DEFAULT_COLS.includes(c.f));
}
function eqFieldValue(e,f){
  if(f==="_estado") return estadoEquipo(e.key);
  if(f==="_pend"){ const n=pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length; return n?String(n):""; }
  if(f==="_ultact") return ultActividad(e.key)||"";
  return e[f]||"";
}
function filteredEquipos(){
  let rows=state.equipos.slice();
  const q=ui.search.trim().toLowerCase();
  if(q){
    rows=rows.filter(e=> [e.inventario,e.equipo,e.serie,e.servicio,e.marca,e.modelo].some(v=>(v||"").toLowerCase().includes(q)));
  }
  // quick filters
  const qk=ui.quick;
  if(qk.familia) rows=rows.filter(e=>e.fam===qk.familia);
  if(qk.servicio) rows=rows.filter(e=>e.servicio===qk.servicio);
  if(qk.estado) rows=rows.filter(e=>estadoEquipo(e.key)===qk.estado);
  if(qk.sinSeg){ const n=diasSinSegPref(); rows=rows.filter(e=>{ if(!ESTADOS_ATENCION.includes(estadoEquipo(e.key))) return false; const d=diasSinActividad(e.key); return d==null||d>=n; }); }
  if(qk.mes!==""){ const m=parseInt(qk.mes,10); rows=rows.filter(e=> e.prog[m] || resultadoMes(e.key,m).resultado); }
  if(qk.codigo!=null && qk.mes!==""){ const m=parseInt(qk.mes,10); rows=rows.filter(e=> matchMesCodigo(e,m,qk.codigo)); }
  // header filters
  for(const f in ui.headerFilters){
    const set=ui.headerFilters[f]; if(!set||!set.size) continue;
    rows=rows.filter(e=> set.has(String(eqFieldValue(e,f))));
  }
  // sort
  if(ui.sortCol && ui.sortDir){
    const f=ui.sortCol, dir=ui.sortDir===1?1:-1;
    rows.sort((a,b)=>{ const va=String(eqFieldValue(a,f)), vb=String(eqFieldValue(b,f));
      return va.localeCompare(vb,undefined,{numeric:true})*dir; });
  }
  return rows;
}
function matchMesCodigo(e,m,code){
  const prog=e.prog[m]; const r=resultadoMes(e.key,m);
  switch(code){
    case "X": case "R": case "RA": case "PM": return prog===code;
    case "sin": return prog && !r.resultado;
    case "Si": return r.resultado==="Si";
    case "Si-RA": return r.resultado==="Si-RA";
    case "C1-8": return /^C[1-8]$/.test(r.resultado);
    case "FS": return r.resultado==="FS";
    case "No": return r.resultado==="No";
    case "NU": return r.resultado==="NU";
    case "Baja": return r.resultado==="Baja";
  }
  return false;
}

      tb.appendChild(tr);
