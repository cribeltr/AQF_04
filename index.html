  }
  paintHist();

  openDrawer((e.equipo||"Equipo")+" · "+(e.inventario||""), body, [], {wide:true});
}
function buildTimeline(key){
  const items=[];
  const mesesConApp=new Set();
  for(const m of mpByEquipo(key)){
    const mm=mesDeFecha(m.fecha); if(mm!=null) mesesConApp.add(mm);
    items.push({ fecha:m.fecha||m.creado, grupo:"MP", tipo:m.tipoRegistro==="Borrador"?"MP (borrador)":"MP", cls:"tl-mp", ico:"✓",
      titulo:`MP ${m.resultado?RESULTADOS[m.resultado]||m.resultado:"(sin resultado)"}`,
      detalle:[m.tipoMantenimiento, m.observaciones].filter(Boolean).join(" · "),
      ejecutor:m.ejecutor||"", estadoEquipo:m.estadoEquipo||"", resultado:m.resultado||"",
      edit:{kind:"mp",id:m.id} });
  }
  // Resultados oficiales de la planilla (.xlsm): solo mes, sin día exacto.
  const anio = (state.meta&&state.meta.fechaCarga? String(state.meta.fechaCarga).slice(0,4):"2026");
  for(const r of regsByEquipo(key)){
    if(!r.resultado) continue;
    if(mesesConApp.has(r.mes)) continue; // ya hay una MP de la app ese mes (con fecha exacta)
    items.push({ fecha:`${anio}-${String(r.mes+1).padStart(2,"0")}-15`, monthOnly:true, grupo:"MP", tipo:"MP oficial", cls:"tl-mp", ico:"▣",
      titulo:`MP ${RESULTADOS[r.resultado]||r.resultado} · planilla oficial`,
      detalle:`Registrada en ${MESES_LARGO[r.mes]} ${anio} (el .xlsm guarda el mes, no el día exacto)`,
      ejecutor:"", estadoEquipo:estadoDeResultado(r.resultado)||"", resultado:r.resultado,
      edit:{kind:"mp_planilla", mes:r.mes} });
  }
  for(const p of pendByEquipo(key)){
    items.push({ fecha:p.creado, grupo:"Pendiente", tipo:`Pendiente · ${PEND_TIPOS[p.tipo]?.label||p.tipo}`, cls:"tl-pend", ico:"◷",
      titulo:`Pendiente ${PEND_TIPOS[p.tipo]?.label||p.tipo} ${p.estado==="Completado"?"(completado)":"creado"}`,
      detalle:p.descripcion||"", ejecutor:p.respEjecutivo||"", estadoEquipo:"", resultado:p.estado||"",
      edit:{kind:"pend",id:p.id} });
    for(const s of (p.seguimiento||[])) items.push({ fecha:s.fecha, grupo:"Pendiente", tipo:"Seguimiento", cls:"tl-pend", ico:"·",
      titulo:"Seguimiento", detalle:s.texto, ejecutor:s.autor||"", estadoEquipo:"", resultado:"", edit:{kind:"pend",id:p.id} });
  }
  for(const c of corrByEquipo(key)){
    items.push({ fecha:c.fechaDocumento||c.creado, grupo:"Correctivo", tipo:"Correctivo · OT", cls:"tl-corr", ico:"⚒",
      titulo:`Correctivo abierto (Folio ${c.folioSigem||"?"})`, detalle:c.requerimiento||"",
      ejecutor:c.tecnico||"", estadoEquipo:c.estadoEquipo||"", resultado:c.estadoEvento||"", edit:{kind:"corr",id:c.id} });
    for(const a of (c.avances||[])) items.push({ fecha:a.fecha||a.registrado, grupo:"Correctivo", tipo:`Correctivo · ${a.tipo}`, cls:"tl-corr", ico:"·",
      titulo:a.tipo, detalle:[a.numero,a.empresa,a.detalle].filter(Boolean).join(" · "),
      ejecutor:a.responsable||"", estadoEquipo:a.estadoEquipoVisita||"", resultado:"", edit:{kind:"corr",id:c.id} });
    if(c.fechaCierre) items.push({ fecha:c.fechaCierre, grupo:"Correctivo", tipo:"Correctivo · cierre", cls:"tl-corr", ico:"⚒",
      titulo:"Correctivo cerrado", detalle:"", ejecutor:"", estadoEquipo:c.estadoEquipo||"", resultado:"Cerrado", edit:{kind:"corr",id:c.id} });
  }
  // Cambios de estado gestionados en la app (trazabilidad de operatividad)
  for(const ev of eventosEstadoDe(key)){
    items.push({ fecha:ev.fecha, grupo:"Estado", tipo:"Cambio de estado", cls:"tl-corr", ico:"◉",
      titulo:`Estado → ${ev.estado}`, detalle:[ev.motivo, ev.nota].filter(Boolean).join(" · "),
      ejecutor:ev.por||"", estadoEquipo:ev.estado, resultado:"" });
  }
  return items.filter(i=>i.fecha).sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha)));
}

const HIST_COLUMNS = [

];

function visibleHistColumns(){
  const sel=(prefs.columnasHistorial&&prefs.columnasHistorial.length)?prefs.columnasHistorial:HIST_DEFAULT_COLS;

function abrirEdicionHist(it, key){
  fichaReturnKey=key; // volver a la ficha al cerrar el editor
  if(it.edit.kind==="mp"){ const m=state.detalleMP.find(x=>x.id===it.edit.id); if(m) openMPForm(m); else fichaReturnKey=null; }
  else if(it.edit.kind==="mp_planilla"){ openMPForm(null, key, it.edit.mes); }
  else if(it.edit.kind==="pend"){ const p=state.pendientes.find(x=>x.id===it.edit.id); if(p) openPendForm(p); else fichaReturnKey=null; }
  else if(it.edit.kind==="corr"){ openCorrExpediente(it.edit.id); }
}

function openMPForm(mp, presetKey, presetMes){
  const isNew=!mp;
  mp = mp || { id:uid(), creado:todayISO(), equipoKey:presetKey||"", fecha:todayISO(), programacion:"X",
    ejecutor:prefs.ultimoEjecutor||"", resultado:"", observaciones:"", estadoEquipo:"Operativo",
    gestionPendiente:false, tipoMantenimiento:prefs.ultimoTipoMant||"Interno", ingenieroExterno:prefs.ultimoIngeniero||"",
    empresaExterna:prefs.ultimaEmpresa||"", tipoRegistro:"Borrador" };
  const f=Object.assign({},mp);
  const body=el("div");
  // equipo selector
  const eqField=el("div",{class:"field"});
  eqField.appendChild(el("label",{},"Equipo (N° Inventario o Serie) *"));
  const eqInput=el("input",{list:"eqlist",placeholder:"Escribe inventario o serie…",value: f.equipoKey?equipoLabel(f.equipoKey):""});
  eqField.appendChild(eqInput);
  const dl=el("datalist",{id:"eqlist"});
  state.equipos.slice(0,3000).forEach(e=> dl.appendChild(el("option",{value:`${e.inventario} · ${e.equipo} · ${e.serie}`})));
  eqField.appendChild(dl);
  const eqInfo=el("div",{class:"hint"}, f.equipoKey?equipoLabel(f.equipoKey):"");
  eqField.appendChild(eqInfo);
  eqInput.addEventListener("change",()=>{ const e=matchEquipo(eqInput.value); if(e){ f.equipoKey=e.key; eqInfo.textContent=`${e.equipo} · ${e.servicio}`; prefillProg(); } });
  body.appendChild(eqField);

  const progField=selField("Programación","programacion",f,Object.keys(PROG_CODES).map(k=>({v:k,t:k+" — "+PROG_CODES[k]})));
  const progSel=progField.querySelector("select");
  // Pre-rellena la Programación con el código real del equipo para el mes de la fecha.
  function prefillProg(){ const eq=equipoByKey(f.equipoKey); const mes=mesDeFecha(f.fecha); if(eq && mes!=null && eq.prog[mes]){ f.programacion=eq.prog[mes]; progSel.value=eq.prog[mes]; } }
  const fechaField=el("div",{class:"field"}); fechaField.appendChild(el("label",{},"Fecha *"));
  const fechaInput=el("input",{type:"date",value:(f.fecha||"").slice(0,10)});
  fechaInput.addEventListener("input",()=>{ f.fecha=fechaInput.value; prefillProg(); });
  fechaField.appendChild(fechaInput);
  body.appendChild(frow([ progField, fechaField ]));
  // pre-relleno inicial: por el mes indicado (MP pendiente) o por el mes de la fecha
  if(presetMes!=null){ const eq=equipoByKey(f.equipoKey); if(eq && eq.prog[presetMes]){ f.programacion=eq.prog[presetMes]; progSel.value=eq.prog[presetMes]; } }
  else if(isNew) prefillProg();
  body.appendChild(frow([
    selField("Ejecutor *","ejecutor",f,EJECUTORES.map(x=>({v:x,t:x}))),
    selField("Resultado *","resultado",f,[{v:"",t:"— elegir —"}].concat(Object.keys(RESULTADOS).map(k=>({v:k,t:k+" — "+RESULTADOS[k]}))),()=>refreshMP()),
  ]));
  const dyn=el("div"); body.appendChild(dyn);
  body.appendChild(frow([
    selField("Tipo mantenimiento","tipoMantenimiento",f,[{v:"Interno",t:"Interno"},{v:"Externo",t:"Externo"}],()=>refreshMP()),
    selField("Estado del equipo","estadoEquipo",f,ESTADOS_EQUIPO.map(x=>({v:x,t:x}))),
  ]));
  const extDyn=el("div"); body.appendChild(extDyn);
  body.appendChild(txtField("Observaciones","observaciones",f));
  const chkGP=el("label",{class:"check"}); const cbGP=el("input",{type:"checkbox"}); cbGP.checked=!!f.gestionPendiente;
  cbGP.addEventListener("change",()=>{ f.gestionPendiente=cbGP.checked; });
  chkGP.appendChild(cbGP); chkGP.appendChild(document.createTextNode("Quedó gestión pendiente (crea pendiente automático)"));
  body.appendChild(chkGP);
  const chkOf=el("label",{class:"check"}); const cbOf=el("input",{type:"checkbox"}); cbOf.checked=f.tipoRegistro==="Oficial";
  cbOf.addEventListener("change",()=>{ f.tipoRegistro=cbOf.checked?"Oficial":"Borrador"; });
  chkOf.appendChild(cbOf); chkOf.appendChild(document.createTextNode("Marcar como Oficial (ya está en la planilla)"));
  body.appendChild(chkOf);

  function refreshMP(){
    // causal info
    dyn.innerHTML="";
    if(/^C[1-8]$/.test(f.resultado)){
      const wrn = REPRO_30DIAS.has(f.resultado) ? `Reprogramación ≤30 días — se creará pendiente de reprogramación.` :
        (REPRO_SIN_FECHA.has(f.resultado)? `Sin fecha (depende de un tercero). Estado: ${estadoDeResultado(f.resultado)||""}.`:"");
      dyn.appendChild(el("div",{class:"banner info",style:"margin:0 0 12px"}, `${f.resultado}: ${CAUSALES[f.resultado]}. ${wrn}`));
    }
    extDyn.innerHTML="";
    if(f.tipoMantenimiento==="Externo"){
      extDyn.appendChild(frow([
        comboField("Ingeniero externo","ingenieroExterno",f,state.ingenieros),
        comboField("Empresa","empresaExterna",f,state.empresas),
      ]));
    }
  }
  refreshMP();

  openDrawer(isNew?"Registrar MP":"Editar MP", body, [
    {label:"Cancelar",act:closeDrawer},
    {label:"Guardar", cls:"primary", act:async()=>{
      if(!f.equipoKey){ toast("Elige el equipo."); return; }
      if(!f.fecha||!f.ejecutor||!f.resultado){ toast("Fecha, ejecutor y resultado son obligatorios."); return; }
      // estado implícito por causal
      const eImpl=estadoDeResultado(f.resultado, f); if(eImpl && !/^Si/.test(f.resultado)) f.estadoEquipo=eImpl;
      f.actualizado=todayISO();
      if(isNew) state.detalleMP.push(f);
      else { const i=state.detalleMP.findIndex(m=>m.id===f.id); if(i>=0) state.detalleMP[i]=f; }
      prefs.ultimoEjecutor=f.ejecutor; prefs.ultimoTipoMant=f.tipoMantenimiento;
      if(f.ingenieroExterno){ prefs.ultimoIngeniero=f.ingenieroExterno; if(!state.ingenieros.includes(f.ingenieroExterno))state.ingenieros.push(f.ingenieroExterno);}
      if(f.empresaExterna){ prefs.ultimaEmpresa=f.empresaExterna; if(!state.empresas.includes(f.empresaExterna))state.empresas.push(f.empresaExterna);}
      await persistPrefs();
      // pendiente automático (B.8)
      // Pendiente automático (§9/§B.8): SIEMPRE con causal C1–C8 (reprogramación);
      // con "gestión pendiente" marcado sin causal → protocolo (interno/externo).
      if(isNew && (f.gestionPendiente || /^C[1-8]$/.test(f.resultado))) crearPendienteAuto(f);
      await markDirty("usuario"); closeDrawer(); render(); toast("MP guardada.");
    }}
  ]);
}
function crearPendienteAuto(mp){
  const yaExiste=state.pendientes.some(p=>p.origenMP===mp.id);
  if(yaExiste) return;
  let tipo, origen="preventiva", tareas=[];
  if(/^C[1-8]$/.test(mp.resultado)){
    tipo="reprogramacion";
    tareas=[ {texto:"generar reporte",hecha:false}, {texto:"imprimir reporte",hecha:false},
             {texto:"firma del supervisor",hecha:false}, {texto:"firma del jefe de equipos",hecha:false} ];
  } else {
    tipo = mp.tipoMantenimiento==="Externo"?"protocolo_externo":"protocolo_interno";
    tareas = tipo==="protocolo_externo"
      ? [ {texto:"solicitar reporte al proveedor",hecha:false}, {texto:"recibir y archivar reporte",hecha:false} ]
      : [ {texto:"completar reporte interno de la MP",hecha:false} ];
  }
  state.pendientes.push({
    id:uid(), creado:todayISO(), origenMP:mp.id, equipoKey:mp.equipoKey, origen, tipo,
    causal:/^C[1-8]$/.test(mp.resultado)?mp.resultado:"", fechaReporte:mp.fecha,
    fechaCompromiso:mp.fecha, prioridad:"Media", situacion:"",
    respEjecutivo:mp.ejecutor||"", respAdministrativo:RESP_ADMIN_DEFAULT, enEsperaDe:"",
    descripcion:`Asociado a MP del ${fmtDate(mp.fecha)}${mp.resultado?` (resultado ${mp.resultado})`:""}.`,
    tareas, seguimiento:[], empresa:mp.empresaExterna||"",
    estado:"Abierto", fechaCompletado:""
  });
  toast("Pendiente automático creado.");
}

function openCorrSubevento(presetKey, presetFolio){
  const f={ folio:presetFolio||"", equipoKey:presetKey||"", subtipo:SUBEVENTOS[0], fecha:todayISO(), detalle:"", responsable:prefs.ultimoEjecutor||"", empresa:"", numero:"", estadoEquipo:"No Operativo" };

  body.appendChild(textField("Folio SIGEM *","folio",f));
  // equipo
  const eqField=el("div",{class:"field"});
  eqField.appendChild(el("label",{},"Equipo (N° Inventario o Serie)"));
  const eqInput=el("input",{list:"eqlist2",placeholder:"Escribe inventario o serie…",value:f.equipoKey?equipoLabel(f.equipoKey):""});
  const dl=el("datalist",{id:"eqlist2"}); state.equipos.slice(0,3000).forEach(e=>dl.appendChild(el("option",{value:`${e.inventario} · ${e.equipo} · ${e.serie}`})));
  eqField.appendChild(eqInput); eqField.appendChild(dl);
  eqInput.addEventListener("change",()=>{ const e=matchEquipo(eqInput.value); if(e)f.equipoKey=e.key; });
  body.appendChild(eqField);
  body.appendChild(frow([
    selField("Tipo de sub-evento *","subtipo",f,SUBEVENTOS.map(x=>({v:x,t:x})), ()=>refresh()),
    dateField("Fecha","fecha",f),
  ]));
  const dyn=el("div"); body.appendChild(dyn);
  body.appendChild(txtField("Detalle","detalle",f));
  function refresh(){
    dyn.innerHTML="";
    const st=f.subtipo;
    if(st.includes("Envío")||st.includes("Visita")||st.includes("OC")||st.includes("Cotización")||st.includes("Reporte")||st.includes("Informe")){
      dyn.appendChild(frow([ textField("N°","numero",f), comboField("Empresa","empresa",f,state.empresas) ]));
    }
    if(st.includes("Reparación")||st.includes("Retorno")||st.includes("Cierre")){
      dyn.appendChild(selField("Estado del equipo","estadoEquipo",f,ESTADOS_EQUIPO.map(x=>({v:x,t:x}))));
    }
    if(st.includes("Orden de Trabajo")){
      dyn.appendChild(frow([ selField("Técnico","responsable",f,EJECUTORES.map(x=>({v:x,t:x}))), selField("Estado inicial","estadoEquipo",f,ESTADOS_EQUIPO.map(x=>({v:x,t:x}))) ]));
    }
  }
  refresh();
  openDrawer("Registrar sub-evento correctivo", body, [
    {label:"Cancelar",act:closeDrawer},
    {label:"Guardar",cls:"primary",act:async()=>{
      if(!f.folio.trim()){ toast("El Folio SIGEM es obligatorio."); return; }
      let c=state.correctivos.find(x=>x.folioSigem===f.folio.trim());
      const isOT=f.subtipo.includes("Orden de Trabajo");
      if(!c){
        c={ id:uid(), creado:todayISO(), equipoKey:f.equipoKey, folioSigem:f.folio.trim(),
          otCompleta:false, tipoEvento:"Orden de Trabajo", requerimiento:"", fechaDocumento: isOT?f.fecha:"",
          tecnico:"", estadoEquipo:f.estadoEquipo||"No Operativo", estadoEvento:"Abierto", tipoRegistro:"Borrador", avances:[] };
        state.correctivos.push(c);
      }
      if(f.equipoKey && !c.equipoKey) c.equipoKey=f.equipoKey;
      if(f.empresa && !state.empresas.includes(f.empresa)) state.empresas.push(f.empresa);
      if(isOT){
        c.otCompleta=true; c.fechaDocumento=f.fecha; c.tecnico=f.responsable||c.tecnico;
        c.requerimiento=f.detalle||c.requerimiento; if(f.estadoEquipo)c.estadoEquipo=f.estadoEquipo;
      } else {
        c.avances.push({ id:uid(), tipo:f.subtipo, fecha:f.fecha, detalle:f.detalle, numero:f.numero, empresa:f.empresa, responsable:f.responsable, estadoEquipoVisita:f.estadoEquipo, registrado:new Date().toISOString() });
        if(f.estadoEquipo) c.estadoEquipo=f.estadoEquipo;
        if(f.subtipo.includes("Cierre")){ c.estadoEvento="Cerrado"; c.fechaCierre=f.fecha; }
      }
      await markDirty("usuario"); closeDrawer(); render(); toast(isOT?"OT registrada.":"Sub-evento adjunto al folio.");
    }}
  ]);
}

// Responsividad de tablas: copia la etiqueta de cada encabezado a sus celdas
// (data-label) para que, en pantallas estrechas, cada fila se vea como tarjeta legible.
function tagResponsiveTables(root){
  if(!root) return;
  root.querySelectorAll("table.grid").forEach(t=>{
    const ths=[...t.querySelectorAll("thead th")];
    if(!ths.length) return;
    const labels=ths.map(th=>((th.querySelector(".sortable")||th).textContent||"").replace(/[▾↑↓]/g,"").trim());
    t.querySelectorAll("tbody tr").forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(td.tagName==="TD" && labels[i]!=null) td.setAttribute("data-label", labels[i]); });
    });
  });
}
// Observa #view y #drawerBody y re-etiqueta las tablas cuando cambian (cubre render,
// drawer y repintados dinámicos). Solo escucha childList → setAttribute no reentra.
function observeResponsiveTables(){
  ["#view","#drawerBody"].forEach(sel=>{ const node=$(sel); if(!node) return;
    try{ new MutationObserver(()=>tagResponsiveTables(node)).observe(node,{childList:true,subtree:true}); }catch(e){}
  });
}
function openDrawer(title, bodyNode, buttons=[], opts={}){
  recordEvent("panel", title);
  $("#drawerTitle").textContent=title;
  $("#drawer").classList.toggle("wide", !!opts.wide);
  const b=$("#drawerBody"); b.innerHTML=""; b.appendChild(bodyNode);
  if(buttons.length){

    buttons.forEach(btn=> bar.appendChild(el("button",{class:"btn "+(btn.cls||""),onclick:btn.act}, btn.label)));
    b.appendChild(bar);
  }
  tagResponsiveTables(b);
  $("#drawer").classList.add("open"); $("#drawerBack").classList.add("open");
}
function closeDrawer(){
  $("#drawer").classList.remove("open"); $("#drawerBack").classList.remove("open");

const APP_NAME = "Gestión de equipos críticos HHHA";
const APP_VERSION = "1.0";

// Comprueba que el motor de Excel (SheetJS) esté disponible. Va embebido en el
// archivo, así que debería estarlo siempre; si no, avisa en vez de fallar en silencio.
function ensureXLSX(){
  if(typeof XLSX==="undefined" || !XLSX || !XLSX.utils){
    toast("⚠ No se pudo iniciar el motor de Excel. Usa «Exportar respaldo JSON».");
    return false;
  }
  return true;
}

// Identificador único por exportación: cada versión exportada lleva un ID distinto
// (sello de tiempo + aleatorio) y un número de versión incremental persistido.
function nuevoExportId(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const stamp=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const rand=Math.random().toString(36).slice(2,6).toUpperCase();
  prefs.exportSeq=(prefs.exportSeq||0)+1; persistPrefs();
  return { id:`GEC-${stamp}-${rand}`, seq:prefs.exportSeq, fecha:d.toISOString() };
}

// Conteo de equipos por estado de operatividad (para indicadores y exportación).
function operatividadResumen(){
  const r={ "Operativo":0,"Servicio Técnico":0,"No Operativo":0,"Préstamo":0,"No Ubicable":0,"Baja":0 };
  for(const e of state.equipos){ const s=estadoEquipo(e.key); r[s]=(r[s]||0)+1; }
  r.total=state.equipos.length; return r;
}

// Bitácora unificada: una fila por evento (MP, pendiente y su seguimiento, correctivo),
// ordenada de más reciente a más antigua. Es el registro compartible de actividad.
function buildBitacora(){
  const ev=[]; const eqOf=k=>equipoByKey(k)||{};
  for(const m of state.detalleMP){ const e=eqOf(m.equipoKey);
    ev.push({ Fecha:(m.fecha||m.creado||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Mantenimiento preventivo", Evento:(RESULTADOS[m.resultado]||m.resultado||"Registro MP"),
      "Estado equipo":m.estadoEquipo||"", Responsable:m.ejecutor||"", Detalle:m.observaciones||"", Referencia:m.tipoRegistro||"" }); }
  for(const p of state.pendientes){ const e=eqOf(p.equipoKey); const tipo=PEND_TIPOS[p.tipo]?.label||p.tipo;
    ev.push({ Fecha:(p.fechaReporte||p.creado||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Pendiente · "+tipo, Evento:"Apertura de pendiente", "Estado equipo":"", Responsable:p.respEjecutivo||"",
      Detalle:p.descripcion||"", Referencia:"Estado: "+(p.estado||"") });
    for(const s of (p.seguimiento||[])) ev.push({ Fecha:(s.fecha||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Pendiente · "+tipo, Evento:"Seguimiento", "Estado equipo":"", Responsable:s.autor||s.por||"", Detalle:s.texto||"", Referencia:"" });
    if(p.estado==="Completado") ev.push({ Fecha:(p.fechaCompletado||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Pendiente · "+tipo, Evento:"Cierre de pendiente", "Estado equipo":"", Responsable:p.respEjecutivo||"", Detalle:p.descripcion||"", Referencia:"" }); }
  for(const c of state.correctivos){ const e=eqOf(c.equipoKey);
    ev.push({ Fecha:(c.fechaDocumento||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Correctivo · Folio "+(c.folioSigem||""), Evento:"Apertura de expediente", "Estado equipo":c.estadoEquipo||"", Responsable:c.tecnico||"", Detalle:"", Referencia:"Estado: "+(c.estadoEvento||"") });
    for(const a of (c.avances||[])) ev.push({ Fecha:(a.fecha||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Correctivo · Folio "+(c.folioSigem||""), Evento:a.tipo||"Avance", "Estado equipo":a.estadoEquipo||"", Responsable:a.responsable||a.empresa||"", Detalle:a.detalle||"", Referencia:a.numero||"" }); }
  for(const ce of state.eventosEstado){ const e=eqOf(ce.equipoKey);
    ev.push({ Fecha:(ce.fecha||"").slice(0,10), "N° Inventario":e.inventario||"", Equipo:e.equipo||"", Servicio:e.servicio||"",
      Categoría:"Estado del equipo", Evento:"Cambio de estado → "+(ce.estado||""), "Estado equipo":ce.estado||"",
      Responsable:ce.por||"", Detalle:[ce.motivo, ce.nota].filter(Boolean).join(" · "), Referencia:"" }); }
  ev.sort((a,b)=> (a.Fecha<b.Fecha?1:(a.Fecha>b.Fecha?-1:0)));
  return ev;
}

function exportJSON(exp){
  exp = exp || nuevoExportId();
  const payload={ app:APP_NAME, tipo:"respaldo-gmp2026-v3", version:3, exportId:exp.id, exportSeq:exp.seq,
    fecha:exp.fecha, meta:state.meta,
    detalleMP:state.detalleMP, pendientes:state.pendientes, correctivos:state.correctivos,
    empresas:state.empresas, ingenieros:state.ingenieros, eventosEstado:state.eventosEstado, prefs };
  download(`GEC-HHHA-${exp.id}.json`, JSON.stringify(payload,null,2));
  dirtySinceBackup=false; changesSinceFolderSave=0; render(); toast("Respaldo JSON exportado · "+exp.id);
}
// "Respaldar ahora": genera el respaldo reimportable (JSON) y la estructura legible
// (Excel) con el MISMO ID de exportación.
function respaldarAhora(){ const exp=nuevoExportId(); exportJSON(exp); exportAllXLSX(exp); }

// Descarga de seguridad (mejor esfuerzo) al cerrar/recargar si hay cambios sin
// respaldar y no hay carpeta de auto-guardado: vuelca un JSON reimportable para no
// perder el trabajo. Los navegadores no siempre permiten descargas al cerrar; la
// vía 100% fiable sigue siendo «Elegir carpeta de auto-guardado».
function safetyDump(){
  try{
    const exp=nuevoExportId();
    const payload={ app:APP_NAME, tipo:"respaldo-gmp2026-v3", version:3, exportId:exp.id, exportSeq:exp.seq, fecha:exp.fecha, meta:state.meta,
      detalleMP:state.detalleMP, pendientes:state.pendientes, correctivos:state.correctivos, empresas:state.empresas, ingenieros:state.ingenieros, eventosEstado:state.eventosEstado, prefs };
    download(`GEC-HHHA-seguridad-${exp.id}.json`, JSON.stringify(payload));
  }catch(e){}
}
async function importJSON(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.tipo==="respaldo-gmp2026"){ // formato viejo → usar importador de migración
      return importOldBackupData(data);
    }
    if(data.detalleMP) state.detalleMP=data.detalleMP;
    if(data.pendientes) state.pendientes=data.pendientes;
    if(data.correctivos) state.correctivos=data.correctivos;
    if(data.empresas) state.empresas=data.empresas;
    if(data.ingenieros) state.ingenieros=data.ingenieros;
    if(data.eventosEstado) state.eventosEstado=data.eventosEstado;
    if(data.prefs) prefs=Object.assign(prefs,data.prefs);
    promoverBorradores();
    const dropRep=dedupReprogramaciones();
    await persistUsuario(); await persistPrefs(); dirtySinceBackup=false; render(); toast("Respaldo importado."+(dropRep?` ${dropRep} reprog. duplicada(s) descartada(s).`:""));
  }catch(e){ toast("Error importando JSON: "+e.message); }
}
async function importOldBackupData(data){ const blob=new File([JSON.stringify(data)],"b.json"); return importOldBackup(blob); }

function exportTableXLSX(rows, name){

// Estructura de exportación compartible y autoexplicativa (se puede trabajar sin la
// app): hojas Resumen (con ID único + indicadores), Equipos, Bitácora, Pendientes,
// Servicio Técnico, No Operativos, y el detalle de Mantenciones/Correctivos/Resumen.
function buildWorkbook(exp){
  exp = exp || nuevoExportId();
  const wb=XLSX.utils.book_new();
  const addSheet=(rows,name)=>{ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{ "(sin datos)":"" }]); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31)); };
  const op=operatividadResumen();
  const pendAbiertos=state.pendientes.filter(p=>p.estado!=="Completado");
  const pendVenc=pendAbiertos.filter(pendienteVencido).length;

  // 0) Resumen / metadatos — ID ÚNICO de exportación + indicadores de operatividad
  addSheet([
    { Campo:"Aplicación", Valor:APP_NAME+" · v"+APP_VERSION },
    { Campo:"ID de exportación", Valor:exp.id },
    { Campo:"N° de versión", Valor:exp.seq },
    { Campo:"Fecha de exportación", Valor:exp.fecha },
    { Campo:"Planilla origen", Valor:(state.meta&&state.meta.archivo)||"" },
    { Campo:"—", Valor:"—" },
    { Campo:"Equipos (total)", Valor:op.total },
    { Campo:"Operativos", Valor:op["Operativo"] },
    { Campo:"En servicio técnico", Valor:op["Servicio Técnico"] },
    { Campo:"No operativos", Valor:op["No Operativo"] },
    { Campo:"En préstamo", Valor:op["Préstamo"] },
    { Campo:"No ubicables", Valor:op["No Ubicable"] },
    { Campo:"De baja", Valor:op["Baja"] },
    { Campo:"—", Valor:"—" },
    { Campo:"Pendientes abiertos", Valor:pendAbiertos.length },
    { Campo:"Pendientes vencidos", Valor:pendVenc },
    { Campo:"Mantenciones registradas", Valor:state.detalleMP.length },
    { Campo:"Correctivos (expedientes)", Valor:state.correctivos.length },
  ], "Resumen");

  // 1) Equipos (con estado de operatividad y nº de pendientes derivados)
  addSheet(state.equipos.map(e=>({
    ID:e.idPlanilla, "N° Carpeta":e.carpeta, "N° Inventario":e.inventario, Equipo:e.equipo, Servicio:e.servicio,
    Unidad:e.unidad, Ubicación:e.ubicacion, Procedencia:e.procedencia, Marca:e.marca, Modelo:e.modelo, "N° Serie":e.serie,
    "Año Instalación":e.anio, "Vida Útil Residual":e.vidaUtil, Clasificación:e.clasif, Familia:e.fam, Frecuencia:e.frecuencia,
    Estado:estadoEquipo(e.key), "Estado fijado en app": ultimoEventoEstado(e.key)?"Sí":"No (derivado)",
    "Pendientes abiertos": pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length,
    "Última actualización": ultActividad(e.key)||"",
    "Días sin actualizar": (()=>{ const d=diasSinActividad(e.key); return d==null?"":d; })()
  })), "Equipos");

  // 2) Bitácora unificada (registro cronológico de actividad)
  addSheet(buildBitacora(), "Bitácora");

  // 3) Pendientes (con estado, compromiso, seguimiento y tareas)
  addSheet(state.pendientes.map(p=>{ const r=pendRowForExport(p);
    r.EnEsperaDe=p.enEsperaDe||""; r.Prioridad=p.prioridad||""; r.Causal=p.causal||"";
    r.Tareas=(p.tareas||[]).map(t=>(t.hecha?"✓ ":"☐ ")+(t.texto||"")).join(" | ");
    r.Seguimiento=(p.seguimiento||[]).map(s=>`${(s.fecha||"").slice(0,10)}: ${s.texto}`).join(" || ");
    r.Creado=p.creado; r.Completado=p.fechaCompletado||""; return r; }), "Pendientes");

  // 4) Servicio Técnico — equipos actualmente en servicio técnico
  const stRows=[];
  for(const e of state.equipos){ if(estadoEquipo(e.key)!=="Servicio Técnico") continue;
    const corr=corrByEquipo(e.key).filter(c=>c.estadoEvento!=="Cerrado");
    const c0=corr[0]||{};
    stRows.push({ "N° Inventario":e.inventario, Equipo:e.equipo, Servicio:e.servicio, "N° Serie":e.serie, Ubicación:e.ubicacion,
      "Folio SIGEM":c0.folioSigem||"", Apertura:(c0.fechaDocumento||"").slice(0,10), Técnico:c0.tecnico||"",
      Empresa:((c0.avances||[]).find(a=>a.empresa)||{}).empresa||"",
      "Pendientes abiertos":pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length }); }
  addSheet(stRows, "Servicio Técnico");

  // 5) No Operativos — equipos detenidos, con folio/motivo
  const noRows=[];
  for(const e of state.equipos){ if(estadoEquipo(e.key)!=="No Operativo") continue;
    const corr=corrByEquipo(e.key).filter(c=>c.estadoEvento!=="Cerrado");
    const pend=pendByEquipo(e.key).filter(p=>p.estado!=="Completado");
    noRows.push({ "N° Inventario":e.inventario, Equipo:e.equipo, Servicio:e.servicio, "N° Serie":e.serie, Ubicación:e.ubicacion,
      "Folio correctivo":(corr[0]||{}).folioSigem||"", "Pendientes abiertos":pend.length,
      "Motivo / último pendiente":(pend[0]||{}).descripcion||((corr[0]||{}).folioSigem?("Correctivo "+corr[0].folioSigem):"") }); }
  addSheet(noRows, "No Operativos");

  // Sin seguimiento — equipos detenidos sin actualizar hace ≥ N días (lo que quedó sin atención)
  addSheet(equiposSinSeguimiento().map(({e,dias})=>{ const ev=ultimoEventoEstado(e.key);
    return { "N° Inventario":e.inventario, Equipo:e.equipo, Servicio:e.servicio, Estado:estadoEquipo(e.key),
      "Días sin actualizar": dias==null?"sin registro":dias, "Última actualización": ultActividad(e.key)||"",
      "Último motivo": (ev&&(ev.motivo||ev.nota))||"", "Pendientes abiertos": pendByEquipo(e.key).filter(p=>p.estado!=="Completado").length };
  }), "Sin seguimiento");

  // 6) Detalle de respaldo: Mantenciones, Correctivos, Avances y Resumen mes×código
  addSheet(state.detalleMP.map(mpRowForExport), "Mantenciones");
  addSheet(state.correctivos.map(corrRowForExport), "Correctivos");
  const avances=[];
  for(const c of state.correctivos){ const e=equipoByKey(c.equipoKey)||{};
    for(const a of (c.avances||[])) avances.push({ Folio:c.folioSigem, Inventario:e.inventario||"", Equipo:e.equipo||"",
      Fecha:(a.fecha||"").slice(0,10), Tipo:a.tipo, "N°":a.numero||"", Empresa:a.empresa||"", Responsable:a.responsable||"", Detalle:a.detalle||"" }); }
  addSheet(avances, "Avances correctivos");
  const { cols, matrix }=resumenMesCodigo();
  addSheet(matrix.map((r,m)=>{ const o={Mes:MESES_LARGO[m]}; cols.forEach(c=>o[c]=r.counts[c]); return o; }), "Resumen mes×código");
  return wb;
}
function exportAllXLSX(exp){
  if(!ensureXLSX()) return;

async function chooseBackupFolder(){
  if(!window.showDirectoryPicker){ toast("Tu navegador no soporta auto-guardado a carpeta. Usa «Respaldar ahora»."); return; }
  try{ backupDirHandle=await window.showDirectoryPicker(); const ok=await saveToFolder(); toast(ok?"Carpeta elegida. Auto-guardado de JSON + Excel activo (incl. al cerrar).":"Carpeta elegida, pero no se pudo escribir aún."); render(); }
  catch(e){ /* cancelado */ }
}
async function saveToFolder(){
  if(!backupDirHandle) return false;
  try{
    const exp=nuevoExportId();
    // JSON reimportable (con ID de exportación)
    const payload={ app:APP_NAME, tipo:"respaldo-gmp2026-v3", version:3, exportId:exp.id, exportSeq:exp.seq, fecha:exp.fecha, meta:state.meta,
      detalleMP:state.detalleMP, pendientes:state.pendientes, correctivos:state.correctivos, empresas:state.empresas, ingenieros:state.ingenieros, eventosEstado:state.eventosEstado, prefs };
    const fhJ=await backupDirHandle.getFileHandle(`GEC-HHHA.json`,{create:true});
    const wJ=await fhJ.createWritable(); await wJ.write(JSON.stringify(payload,null,2)); await wJ.close();
    // Excel legible (mismo libro y mismo ID que "Respaldar ahora")
    const buf=XLSX.write(buildWorkbook(exp),{type:"array",bookType:"xlsx"});
    const fhX=await backupDirHandle.getFileHandle(`GEC-HHHA.xlsx`,{create:true});
    const wX=await fhX.createWritable(); await wX.write(buf); await wX.close();
    dirtySinceBackup=false; changesSinceFolderSave=0;
    return true;
  }catch(e){ console.warn("auto-guardado falló",e); return false; }
}

function diagnosticoDatos(){
  const keys=new Set(state.equipos.map(e=>e.key));
  const orphMP=state.detalleMP.filter(m=>!keys.has(m.equipoKey));
  const orphPend=state.pendientes.filter(p=>!keys.has(p.equipoKey));
  const orphCorr=state.correctivos.filter(c=>!keys.has(c.equipoKey));
  const groups={}; state.pendientes.forEach(p=>{ const k=p.equipoKey+"|"+p.tipo; (groups[k]=groups[k]||[]).push(p); });
  const dups=Object.entries(groups).filter(([k,a])=>a.length>1 && keys.has(a[0].equipoKey)).map(([k,a])=>a);
  return { orphMP, orphPend, orphCorr, dups };
}

  const out=[];
  if(!state.equipos.length) return out;
  const sinRes=mpSinResultado();
  const mpVenc=sinRes.filter(x=>x.vencida).length;
  if(mpVenc) out.push({ icon:"⚠", sev:"alert", titulo:"MP vencidas", sub:"meses pasados sin registro", n:mpVenc, go:()=>{ui.view="preventivo";render();} });
  const pendVenc=state.pendientes.filter(p=>p.estado!=="Completado" && pendienteVencido(p)).length;
  if(pendVenc) out.push({ icon:"◷", sev:"alert", titulo:"Pendientes vencidos", sub:"pasada la fecha de compromiso", n:pendVenc, go:()=>{ui.view="pendientes"; ui.pendEstado="Abierto"; ui.pendSinSeg=false; render();} });
  const sinSeg=equiposSinSeguimiento().length;
  if(sinSeg) out.push({ icon:"●", sev:"alert", titulo:"Equipos sin seguimiento", sub:`detenidos sin actualizar ≥${diasSinSegPref()} días`, n:sinSeg, go:()=>goEquipos({sinSeg:true}) });
  const firmar=state.pendientes.filter(p=>p.tipo==="reprogramacion" && p.estado!=="Completado" && !reprogFirmada(p)).length;
  if(firmar) out.push({ icon:"✍", sev:"warn", titulo:"Reprogramaciones por firmar", sub:"esperan 2 firmas", n:firmar, go:()=>{ui.view="reprogramacion";render();} });
  const mpMes=sinRes.length-mpVenc;
  if(mpMes) out.push({ icon:"✓", sev:"warn", titulo:"MP del mes por gestionar", sub:"programadas este mes sin resultado", n:mpMes, go:()=>{ui.view="preventivo";render();} });
  return out;
}
function syncAlertsBtn(){
  const b=$("#btnAlerts"), badge=$("#alertBadge"); if(!b||!badge) return;
  const a=computeAlerts(); const cats=a.length;
  b.classList.toggle("has-alerts", a.some(x=>x.sev==="alert"));
  if(cats){ badge.textContent=String(cats); badge.hidden=false; } else badge.hidden=true;
  b.title = cats? `${cats} tipo(s) de alerta — clic para ver` : "Alertas y recordatorios — todo al día";
}
function openAlerts(){
  const body=el("div");
  if(!state.equipos.length){ body.appendChild(el("div",{class:"small muted"},"Carga la programación y el respaldo del día para ver las alertas.")); openDrawer("Alertas y recordatorios", body); return; }
  const alerts=computeAlerts();
  if(!alerts.length){ body.appendChild(el("div",{class:"empty"}, el("div",{class:"big"},"✓"), el("div",{},"Todo al día."), el("div",{class:"small muted",style:"margin-top:6px"},"No hay acciones pendientes de atención."))); openDrawer("Alertas y recordatorios", body); return; }
  body.appendChild(el("div",{class:"small muted",style:"margin-bottom:12px"},"Acciones que requieren tu atención. Toca una para ir directo:"));

      el("div",{class:"a-go"}, "›")));
  }
  openDrawer("Alertas y recordatorios", body);
}
// Aviso proactivo al abrir (una vez por sesión, cuando ya hay datos cargados).
let _alertasAvisadas=false;
function avisarAlertasUnaVez(){
  if(_alertasAvisadas || !state.equipos.length) return;
  _alertasAvisadas=true;
  const a=computeAlerts(); const total=a.reduce((s,x)=>s+x.n,0);
  if(total) toast(`🔔 ${total} alerta(s) requieren atención — abre la campana para verlas.`);
}

/* ----------------------------- Paleta de comandos (⌘K) ------------------ */
let _cmdk = null;       // { scrim, input, list, flat:[{it,node}], idx }

function cmdkActions(){
  const acts = [];
  for(const n of NAV) acts.push({ icon:n.ico, title:n.label, sub:"Ir a la vista", run:()=>{ ui.view=n.id; render(); } });
  acts.push({ icon:"⤓", title:"Cargar .xlsm",                sub:"Lee ProgramaciónMP2026.xlsm",      run:()=>$("#fileXlsm").click() });
  acts.push({ icon:"💾", title:"Respaldar ahora",            sub:"JSON reimportable + libro Excel",  run:respaldarAhora });
  acts.push({ icon:"⇪", title:"Importar respaldo anterior",  sub:"Migra datos de la app antigua",    run:openImportOld });
  acts.push({ icon:"⊞", title:"Importar planilla integrada", sub:"Sistema_Gestion_MP2026_Integrado", run:()=>$("#fileIntegrado").click() });
  acts.push({ icon:"≣", title:"Importar consolidado",        sub:"Uno o varios .xlsx",               run:()=>$("#fileConsolidado").click() });
  acts.push({ icon:"⊟", title:"Exportar Excel compartible",  sub:"Resumen+Equipos+Bitácora+Pendientes+ST+No Op.",  run:exportAllXLSX });
  acts.push({ icon:"☾", title:"Cambiar tema claro/oscuro",   sub:"Apariencia",                       run:toggleTheme });
  acts.push({ icon:"▦", title:"Cambiar densidad",            sub:"Compacta / cómoda",                run:toggleDensity });
  acts.push({ icon:"⋯", title:"Más acciones…",               sub:"Abrir el menú completo",           run:openMenu });
  return acts;
}

function buildCmdkResults(q){
  q = (q||"").trim().toLowerCase();
  const groups = [];
  let acts = cmdkActions();
  if(q) acts = acts.filter(a => (a.title+" "+(a.sub||"")).toLowerCase().includes(q));
  if(acts.length) groups.push({ label:"Acciones", items: q ? acts : acts.slice(0,7) });
  if(q && state.equipos.length){
    const eqs = state.equipos.filter(e => [e.inventario,e.equipo,e.serie,e.servicio,e.marca,e.modelo]
        .some(x => String(x||"").toLowerCase().includes(q)))
      .slice(0,15).map(e => ({
        icon:"▦",
        title:(e.inventario? e.inventario+" · " : "")+(e.equipo||"(sin nombre)"),
        sub:[e.servicio, e.serie].filter(Boolean).join(" · "),
        run:()=>openFicha(e.key)
      }));
    if(eqs.length) groups.push({ label:"Equipos", items: eqs });
  }
  return groups;
}

function openCmdk(){
  if(_cmdk) return;
  const input = el("input",{type:"text",placeholder:"Buscar equipo o acción…",autocomplete:"off",spellcheck:"false"});
  const list  = el("div",{class:"cmdk-list"});
  const box   = el("div",{class:"cmdk"}, input, list);
  const scrim = el("div",{class:"cmdk-scrim on"}, box);
  document.body.appendChild(scrim);
  _cmdk = { scrim, input, list, flat:[], idx:0 };
  scrim.addEventListener("mousedown", e=>{ if(e.target===scrim) closeCmdk(); });
  input.addEventListener("input", renderCmdk);
  input.addEventListener("keydown", cmdkKeydown);
  renderCmdk();
  setTimeout(()=>input.focus(), 0);
  recordEvent("ui","Abrió paleta ⌘K");
}
function closeCmdk(){ if(!_cmdk) return; _cmdk.scrim.remove(); _cmdk=null; }
function renderCmdk(){
  if(!_cmdk) return;
  const groups = buildCmdkResults(_cmdk.input.value);
  const flat = []; _cmdk.list.innerHTML="";
  if(!groups.length){ _cmdk.list.appendChild(el("div",{class:"cmdk-empty"},"Sin resultados")); _cmdk.flat=[]; return; }
  for(const g of groups){
    _cmdk.list.appendChild(el("div",{class:"cmdk-sec"}, g.label));
    for(const it of g.items){
      const i = flat.length;
      const node = el("div",{class:"cmdk-item", onmouseenter:()=>{ _cmdk.idx=i; paintCmdk(); }, onclick:()=>runCmdk(i)},
        el("div",{class:"c-ico"}, it.icon||"•"),
        el("div",{class:"c-main"}, el("div",{class:"c-title"}, it.title), it.sub? el("div",{class:"c-sub"}, it.sub) : null));
      flat.push({ it, node });
      _cmdk.list.appendChild(node);
    }
  }
  _cmdk.flat = flat;
  if(_cmdk.idx >= flat.length) _cmdk.idx = 0;
  paintCmdk();
}
function paintCmdk(){
  if(!_cmdk) return;
  _cmdk.flat.forEach((f,i)=> f.node.classList.toggle("on", i===_cmdk.idx));
  const cur = _cmdk.flat[_cmdk.idx];
  if(cur && cur.node.scrollIntoView) cur.node.scrollIntoView({ block:"nearest" });
}
function runCmdk(i){
  const f = _cmdk && _cmdk.flat[i]; if(!f) return;
  closeCmdk();
  try{ f.it.run(); }catch(err){ console.error(err); toast("No se pudo ejecutar la acción."); }
}
function cmdkKeydown(e){
  if(!_cmdk) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); _cmdk.idx=Math.min(_cmdk.idx+1, _cmdk.flat.length-1); paintCmdk(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); _cmdk.idx=Math.max(_cmdk.idx-1, 0); paintCmdk(); }
  else if(e.key==="Enter"){ e.preventDefault(); runCmdk(_cmdk.idx); }
  else if(e.key==="Escape"){ e.preventDefault(); closeCmdk(); }
}

/* ----------------------------- Navegación j/k en tablas ----------------- */
let _kbIdx = -1;
function kbRows(){ return Array.from(document.querySelectorAll("#view table.grid tbody tr.clickable")); }
function kbMove(delta){
  const rows = kbRows(); if(!rows.length) return;
  rows.forEach(r=>r.classList.remove("kb-focus"));
  _kbIdx = (_kbIdx<0) ? (delta>0?0:rows.length-1) : Math.max(0, Math.min(_kbIdx+delta, rows.length-1));
  const r = rows[_kbIdx];
  if(r){ r.classList.add("kb-focus"); if(r.scrollIntoView) r.scrollIntoView({ block:"nearest" }); }
}
function kbOpen(){ const rows = kbRows(); if(_kbIdx>=0 && rows[_kbIdx]) rows[_kbIdx].click(); }

/* ------------------------------ Bootstrap -------------------------------- */
function wireUI(){
  $("#btnLoadXlsm").addEventListener("click",()=>$("#fileXlsm").click());
  $("#btnBackupNow").addEventListener("click",respaldarAhora);
  $("#btnMenu").addEventListener("click",openMenu);
  // Look & UX: aplica tema/densidad guardados (sincroniza iconos) y conecta toggles + paleta.
  applyTheme(getTheme()); applyDensity(getDensity());
  observeResponsiveTables();
  $("#btnCmd")?.addEventListener("click",openCmdk);
  $("#btnTheme")?.addEventListener("click",toggleTheme);
  $("#btnDensity")?.addEventListener("click",toggleDensity);
  applyNav(getNav()); $("#btnNav")?.addEventListener("click",toggleNav);
  $("#btnAlerts")?.addEventListener("click",openAlerts);
  $("#drawerClose").addEventListener("click",closeDrawer);
  $("#drawerBack").addEventListener("click",closeDrawer);
  $("#fileXlsm").addEventListener("change",e=>{ const f=e.target.files[0]; if(f)importXlsm(f); e.target.value=""; });
  $("#fileJson").addEventListener("change",e=>{ const f=e.target.files[0]; if(f)importJSON(f); e.target.value=""; });
  $("#fileOldBackup").addEventListener("change",e=>{ const f=e.target.files[0]; if(f){closeDrawer();importOldBackup(f);} e.target.value=""; });
  $("#fileIntegrado").addEventListener("change",e=>{ const f=e.target.files[0]; if(f){closeDrawer();importIntegrado(f);} e.target.value=""; });
  $("#fileConsolidado").addEventListener("change",async e=>{ const fs=Array.from(e.target.files); closeDrawer(); for(const f of fs) await importConsolidado(f); e.target.value=""; });

  const SEARCH_VIEWS=["equipos","pendientes","correctivo","preventivo"]; // vistas donde la búsqueda filtra in situ
  let deb;
  $("#globalSearch").addEventListener("input",e=>{ clearTimeout(deb); deb=setTimeout(()=>{ ui.search=e.target.value;
    if(e.target.value.trim()){ recordEvent("buscar",e.target.value.trim());
      // La búsqueda aplica en Equipos, Pendientes y Correctivos; desde otras vistas, saltar a Equipos.
      if(state.equipos.length && !SEARCH_VIEWS.includes(ui.view)){ ui.view="equipos"; recordEvent("nav","Auto → Equipos por búsqueda"); }
    }
    render(); },300); });
  // Enter en la búsqueda: si queda un único equipo, abre su ficha directamente (1 gesto).
  $("#globalSearch").addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    clearTimeout(deb); ui.search=e.target.value;
    if(state.equipos.length && !SEARCH_VIEWS.includes(ui.view)) ui.view="equipos";
    render();
    if(ui.view==="equipos"){ const res=filteredEquipos();
      if(res.length===1){ recordEvent("atajo","Enter → abre único resultado "+res[0].inventario); openFicha(res[0].key); }
      else recordEvent("atajo",`Enter en búsqueda (${res.length} resultados)`); }
  });

  document.addEventListener("keydown",e=>{
    // ⌘K / Ctrl+K: abre o cierra la paleta de comandos desde cualquier sitio.
    if((e.metaKey||e.ctrlKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); _cmdk?closeCmdk():openCmdk(); return; }
    // Mientras la paleta está abierta su propio manejador gobierna (salvo Escape global).
    if(_cmdk){ if(e.key==="Escape"){ e.preventDefault(); closeCmdk(); } return; }
    if(e.key==="Escape"){ closeDrawer(); closeFunnel(); }
    const tag=(document.activeElement&&document.activeElement.tagName)||"";
    const typing=["INPUT","TEXTAREA","SELECT"].includes(tag);
    // "/" enfoca la búsqueda (atajo de teclado, salvo si ya se escribe en un campo)
    if(e.key==="/" && !typing){ e.preventDefault(); const s=$("#globalSearch"); s.focus(); s.select(); return; }
    // Navegación por teclado en tablas: j/k mueven el foco, Enter abre la fila enfocada.
    if(!typing && (e.key==="j"||e.key==="k")){ e.preventDefault(); kbMove(e.key==="j"?1:-1); return; }
    if(!typing && e.key==="Enter"){ const rows=kbRows(); if(_kbIdx>=0 && rows[_kbIdx]){ e.preventDefault(); kbOpen(); } }
  });
  // Al ocultar la pestaña: si hay carpeta de auto-guardado, escribir JSON+Excel
  // (más fiable que beforeunload para operaciones asíncronas).
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ persistUsuario(); if(backupDirHandle && dirtySinceBackup) saveToFolder(); } });
  // Al cerrar/recargar/navegar (no en simples cambios de pestaña): guardar a carpeta si
  // la hay; si no, descargar un respaldo de SEGURIDAD para no perder el trabajo.
  window.addEventListener("pagehide",()=>{
    persistUsuario();
    if(dirtySinceBackup){ if(backupDirHandle) saveToFolder(); else safetyDump(); }
  });
  // Aviso al cerrar si hay cambios sin respaldar y no hay auto-guardado a carpeta.
  window.addEventListener("beforeunload",e=>{ if(dirtySinceBackup && !backupDirHandle){ e.preventDefault(); e.returnValue=""; } });
}

async function resetSilencioso(){
  await idbDel(LS_PREF); await idbDel(LS_DATOS); await idbDel(LS_USUARIO);
  try{ localStorage.removeItem(LS_PREF); localStorage.removeItem(LS_DATOS); localStorage.removeItem(LS_USUARIO);}catch(e){}
  state={ equipos:[],registros:[],detalleMP:[],pendientes:[],correctivos:[],empresas:[],ingenieros:[],meta:null,eventosEstado:[] };
  prefs={ columnasEquipos:null, columnasHistorial:null, ultimoEjecutor:"", ultimoTipoMant:"Interno", ultimaEmpresa:"", ultimoIngeniero:"" };
  _recuperable=null; dirtySinceBackup=false; invalidarIndices();
}
(async function init(){
  wireUI();
  // Arranque limpio con #reset (abre index.html#reset para empezar sin datos)
  if(location.hash.replace("#","").toLowerCase()==="reset"){
    await resetSilencioso();
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    toast("Iniciado sin datos. Carga la programación (.xlsm) y el respaldo para comenzar.");
  } else {
    await loadAll();
  }
  render();
})();
</script>
